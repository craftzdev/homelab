# ===========================================================================
# Cilium L2 LoadBalancer — IP プールと ARP 広告ポリシー
#
# MetalLB の代替。Service type=LoadBalancer に IP を払い出し、
# VLAN40 の L2 セグメントへ ARP で広告する。
#
# ⚠️ ここで払い出す IP は「宅内からアクセスできる」だけであり、
#    インターネットには一切公開されない。外部公開は Cloudflare Tunnel
#    のみで行う（docs/40-external-access.md）。
# ===========================================================================
---
apiVersion: cilium.io/v2alpha1
kind: CiliumLoadBalancerIPPool
metadata:
  name: vlan40-pool
spec:
  # docs/10-network-design.md §2 の予約表と一致させること。
  # .240 以降は将来用に空けている。
  blocks:
    - start: "172.16.40.200"
      stop: "172.16.40.239"

  # ---------------------------------------------------------------------------
  # ⚠️ 明示的にラベルを付けた Service だけを対象にする
  #
  # セレクタを付けないと、**全 namespace のあらゆる LoadBalancer Service**
  # に IP が払い出され、VLAN40 へ自動的に L2 広告される。
  # 「うっかり type: LoadBalancer にしたら宅内へ公開されていた」という
  # 事故が起きうる。
  #
  # 宅内へ公開してよいと判断した Service にだけ
  #   homelab.io/lan-exposed: "true"
  # を付ける運用にすることで、公開は必ず意図的な行為になる。
  # ---------------------------------------------------------------------------
  serviceSelector:
    matchLabels:
      homelab.io/lan-exposed: "true"

  disabled: false

---
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: vlan40-l2-announcement
spec:
  # ---------------------------------------------------------------------------
  # 広告候補はワークロードノードだけにする。
  #
  # ⚠️ LoadBalancer Service を externalTrafficPolicy: Local にすると、その IP は
  #    backend を持つノードでしか転送できない。広告候補に control-plane を
  #    含めると、Lease をそちらが取った瞬間に通信が落ちる（harbor-ci-proxy は
  #    ワークロードノードにしか置いていない）。
  #
  # 現在 LB IP を持つ Service（image-registry / harbor-ci-proxy）はどちらも
  # ワークロードノードで動く。control-plane にしか置けない Service を
  # LB 公開する場合は、ここと Service の配置を合わせて見直すこと。
  # ---------------------------------------------------------------------------
  nodeSelector:
    matchLabels:
      homelab.craftz.dev/workload-plane: "true"

  # ---------------------------------------------------------------------------
  # 広告を出すインタフェースを VLAN40 側に限定する。
  #
  # ⚠️ これは重要な設定である。デュアル NIC 構成でインタフェースを
  #    限定しないと、Ceph public network（VLAN20）側にも ARP 広告が
  #    流れ、Ceph のネットワークに無関係なトラフィックが混入する。
  #
  # Talos の predictable interface name（ens18 / enp0s18 等）は環境で
  # 変わりうるため、正規表現で「1 枚目の NIC」に一致させている。
  # 実際の名前は次のコマンドで確認できる:
  #   talosctl -n <node> get links
  # ---------------------------------------------------------------------------
  interfaces:
    - "^(eth0|ens18|enp0s18|enp1s0)$"

  externalIPs: true
  loadBalancerIPs: true
