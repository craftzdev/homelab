# ===========================================================================
# moshitoku のイメージビルド用セルフホストランナー
#
# GitHub ホストランナーからは Harbor（172.16.40.201:5000）へ到達できないため、
# クラスタ内でビルドして push する。
#
# 既存の ai-agent-builder と同じ構成であり、差分は
# githubConfigUrl と runnerScaleSetName のみ。
# ===========================================================================
githubConfigUrl: https://github.com/craftzdev/moshitoku
githubConfigSecret: arc-github-app

runnerScaleSetName: moshitoku-builder
minRunners: 0
# CI は lint / test / security / manifests / build の 5 ジョブに分かれている。
# 1 本しか起動できないと直列実行になり、待ち時間が積み上がる。
# requests は 1 本あたり CPU 500m / メモリ 1Gi であり、
# 4 本同時でも 2 CPU / 4Gi の予約で収まる。
maxRunners: 4

controllerServiceAccount:
  namespace: arc-systems
  name: arc-controller-gha-rs-controller

template:
  spec:
    automountServiceAccountToken: false
    nodeSelector:
      homelab.craftz.dev/workload-plane: "true"
    initContainers:
      - name: init-dind-externals
        image: >-
          ghcr.io/actions/actions-runner@sha256:e5496277be5d09bc968b3d64911b74e219ac4a3f2edce956a3ecf9271bea1ef4
        command: ["cp", "-r", "/home/runner/externals/.", "/home/runner/tmpDir/"]
        volumeMounts:
          - name: dind-externals
            mountPath: /home/runner/tmpDir
      - name: dind
        image: >-
          docker:29.8.0-dind@sha256:5efed980cba3fc126cf54e21a5a6ff8849d05b6e0623d6e7612f48e9cd6cd17e
        command: ["/bin/sh", "-c"]
        args:
          - >-
            update-ca-certificates &&
            exec dockerd --host=unix:///var/run/docker.sock --group=${DOCKER_GROUP_GID}
        env:
          - name: DOCKER_GROUP_GID
            value: "123"
        securityContext:
          privileged: true
        restartPolicy: Always
        startupProbe:
          exec:
            command: ["docker", "info"]
          failureThreshold: 24
          periodSeconds: 5
        volumeMounts:
          - name: work
            mountPath: /home/runner/_work
          - name: dind-sock
            mountPath: /var/run
          - name: dind-externals
            mountPath: /home/runner/externals
          - name: harbor-ci-cert
            mountPath: /etc/docker/certs.d/172.16.40.201:5000/ca.crt
            subPath: tls.crt
            readOnly: true
          - name: harbor-ci-cert
            mountPath: /usr/local/share/ca-certificates/harbor-ci.crt
            subPath: tls.crt
            readOnly: true
    containers:
      - name: runner
        image: >-
          ghcr.io/actions/actions-runner@sha256:e5496277be5d09bc968b3d64911b74e219ac4a3f2edce956a3ecf9271bea1ef4
        command: ["/home/runner/run.sh"]
        env:
          - name: DOCKER_HOST
            value: unix:///var/run/docker.sock
          - name: RUNNER_WAIT_FOR_DOCKER_IN_SECONDS
            value: "120"
        volumeMounts:
          - name: work
            mountPath: /home/runner/_work
          - name: dind-sock
            mountPath: /var/run
          - name: harbor-ci-cert
            mountPath: /etc/harbor-ci/ca.crt
            subPath: tls.crt
            readOnly: true
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: "4"
            memory: 8Gi
    volumes:
      - name: work
        emptyDir: {}
      - name: dind-sock
        emptyDir: {}
      - name: dind-externals
        emptyDir:
          medium: Memory
          sizeLimit: 1Gi
      - name: harbor-ci-cert
        secret:
          secretName: harbor-ci-proxy-tls
