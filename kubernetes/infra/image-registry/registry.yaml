apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: registry-data
  namespace: image-registry
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: longhorn-retain
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: image-registry
  labels:
    app.kubernetes.io/name: registry
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: registry
  template:
    metadata:
      labels:
        app: registry
        app.kubernetes.io/name: registry
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        homelab.craftz.dev/workload-plane: "true"
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: registry
          image: registry:2.8.3
          env:
            - name: REGISTRY_HTTP_ADDR
              value: 0.0.0.0:5000
            - name: REGISTRY_HTTP_TLS_CERTIFICATE
              value: /tls/tls.crt
            - name: REGISTRY_HTTP_TLS_KEY
              value: /tls/tls.key
          ports:
            - name: https
              containerPort: 5000
          readinessProbe:
            httpGet:
              path: /v2/
              port: https
              scheme: HTTPS
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: data
              mountPath: /var/lib/registry
            - name: tls
              mountPath: /tls
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: registry-data
        - name: tls
          secret:
            secretName: registry-tls
            defaultMode: 0440
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: image-registry
  labels:
    app.kubernetes.io/name: registry
    homelab.io/lan-exposed: "true"
spec:
  type: LoadBalancer
  loadBalancerIP: 172.16.40.200
  selector:
    app: registry
  ports:
    - name: https
      port: 5000
      targetPort: https
