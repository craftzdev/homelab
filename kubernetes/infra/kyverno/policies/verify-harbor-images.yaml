# ===========================================================================
# Harbor のアプリイメージに署名があることを検証する
#
# ---------------------------------------------------------------------------
# いまは Audit（記録のみ）
# ---------------------------------------------------------------------------
# failureAction: Audit なので、署名が無くても Pod は作成される。結果は
# PolicyReport に残る。次のコマンドで確認できる。
#
#   kubectl get policyreport -A | grep -v "0 *0 *0"
#   kubectl get clusterpolicyreport
#
# 全イメージが署名付きに入れ替わり、fail が出なくなったら Enforce へ
# 変える。切り替えは failureAction を Enforce にするだけ。
#
# ---------------------------------------------------------------------------
# 署名の取得先
# ---------------------------------------------------------------------------
# 署名はイメージと同じ Harbor から HTTPS で取る。Kyverno には「公開 CA ＋
# Harbor の CA」を束ねた信頼ストアを渡してある（values.yaml と
# scripts/reconcile-kyverno-ca-bundle.sh）。
#
# ⚠️ 署名は cosign 2 系が付ける sha256-<digest>.sig タグを読む。cosign 3 の
#    既定（OCI 1.1 の referrer + sigstore bundle）は Kyverno 1.19 が読めず、
#    「no signatures found」になる。アプリ側の CI は 2 系に固定してある。
#
# ---------------------------------------------------------------------------
# 何を信頼するのか
# ---------------------------------------------------------------------------
# keyless 署名なので、信頼するのは鍵ではなく「発行元（GitHub Actions の
# OIDC issuer）」と「署名者の身元（どのリポジトリのどのワークフローか）」。
# subject を main ブランチのワークフローに固定しているため、fork や別の
# ブランチで作ったイメージは一致しない。
# ===========================================================================
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verify-harbor-images
  annotations:
    policies.kyverno.io/title: Verify Harbor application images
    policies.kyverno.io/category: Supply Chain
spec:
  webhookConfiguration:
    # Kyverno が落ちている間にクラスタが止まらないようにする。
    failurePolicy: Ignore
    timeoutSeconds: 30
  # 既存 Pod も定期的に評価し、PolicyReport に反映させる。
  background: true
  rules:
    - name: ai-business-agent
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [ai-agent]
      verifyImages:
        - imageReferences:
            - "172.16.40.201:5000/ai-business/ai-business-agent*"
          failureAction: Audit
          required: true
          verifyDigest: true
          # マニフェストは既にダイジェストで固定してある。Kyverno に
          # 書き換えさせない（書き換えにはイメージ本体への到達が要る）。
          mutateDigest: false
          # OCI 1.1 の referrer も見る（署名は cosign 2 のタグ側に付く）。
          cosignOCI11: true
          imageRegistryCredentials:
            secrets:
              - harbor-pull-ai-business
          attestors:
            - entries:
                - keyless:
                    issuer: https://token.actions.githubusercontent.com
                    subject: https://github.com/craftzdev/ai-business-agent/.github/workflows/container.yaml@refs/heads/main
                    rekor:
                      url: https://rekor.sigstore.dev

    - name: ai-business-worker
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [ai-worker]
      verifyImages:
        - imageReferences:
            - "172.16.40.201:5000/ai-business/ai-business-worker*"
          failureAction: Audit
          required: true
          verifyDigest: true
          mutateDigest: false
          # OCI 1.1 の referrer も見る（署名は cosign 2 のタグ側に付く）。
          cosignOCI11: true
          imageRegistryCredentials:
            secrets:
              - harbor-pull-ai-business
          attestors:
            - entries:
                - keyless:
                    issuer: https://token.actions.githubusercontent.com
                    subject: https://github.com/craftzdev/ai-business-worker/.github/workflows/container.yaml@refs/heads/main
                    rekor:
                      url: https://rekor.sigstore.dev

    - name: ai-business-control-plane
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [ai-control-plane]
      verifyImages:
        - imageReferences:
            - "172.16.40.201:5000/ai-business/ai-business-control-plane*"
          failureAction: Audit
          required: true
          verifyDigest: true
          mutateDigest: false
          # OCI 1.1 の referrer も見る（署名は cosign 2 のタグ側に付く）。
          cosignOCI11: true
          imageRegistryCredentials:
            secrets:
              - harbor-pull-ai-business
          attestors:
            - entries:
                - keyless:
                    issuer: https://token.actions.githubusercontent.com
                    subject: https://github.com/craftzdev/ai-business-control-plane/.github/workflows/container.yaml@refs/heads/main
                    rekor:
                      url: https://rekor.sigstore.dev

    - name: moshitoku
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [moshitoku]
      verifyImages:
        - imageReferences:
            - "172.16.40.201:5000/moshitoku/moshitoku*"
          skipImageReferences:
            - "172.16.40.201:5000/moshitoku/moshitoku-scraper*"
          failureAction: Audit
          required: true
          verifyDigest: true
          mutateDigest: false
          # OCI 1.1 の referrer も見る（署名は cosign 2 のタグ側に付く）。
          cosignOCI11: true
          imageRegistryCredentials:
            secrets:
              - harbor-pull-moshitoku
          attestors:
            - entries:
                - keyless:
                    issuer: https://token.actions.githubusercontent.com
                    subject: https://github.com/craftzdev/moshitoku/.github/workflows/container.yml@refs/heads/main
                    rekor:
                      url: https://rekor.sigstore.dev

    - name: moshitoku-scraper
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [moshitoku-scraper]
      verifyImages:
        - imageReferences:
            - "172.16.40.201:5000/moshitoku/moshitoku-scraper*"
          failureAction: Audit
          required: true
          verifyDigest: true
          mutateDigest: false
          # OCI 1.1 の referrer も見る（署名は cosign 2 のタグ側に付く）。
          cosignOCI11: true
          imageRegistryCredentials:
            secrets:
              - harbor-pull-moshitoku
          attestors:
            - entries:
                - keyless:
                    issuer: https://token.actions.githubusercontent.com
                    subject: https://github.com/craftzdev/moshitoku-scraper/.github/workflows/container.yml@refs/heads/main
                    rekor:
                      url: https://rekor.sigstore.dev
