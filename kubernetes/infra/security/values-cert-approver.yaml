# ===========================================================================
# kubelet-serving-cert-approver
#
# ---------------------------------------------------------------------------
# なぜこれが必要なのか
# ---------------------------------------------------------------------------
# Talos の machine config で kubelet に
#   rotate-server-certificates: "true"
#   serverTLSBootstrap: true
# を設定している。これにより kubelet は自身の serving 証明書を
# CSR として申請するが、**Kubernetes には kubelet serving 証明書を
# 自動承認する仕組みが標準では存在しない**（意図的にそうなっている）。
#
# 承認されないと CSR が Pending のまま残り、kubelet の serving 証明書が
# 自己署名のままになる。すると metrics-server や Prometheus が
# kubelet に接続する際に証明書の検証に失敗する。
#
# 多くの構成ではこれを --kubelet-insecure-tls で回避するが、それは
# 「証明書の検証をやめる」ことであり、中間者攻撃への耐性を失う。
# このコンポーネントを入れることで、検証を有効にしたまま運用できる。
#
# ---------------------------------------------------------------------------
# セキュリティ上の注意
# ---------------------------------------------------------------------------
# このコンポーネントは CSR を自動承認する権限を持つ。ただし承認するのは
#   - signerName が kubernetes.io/kubelet-serving のもの
#   - 要求元が system:nodes グループのノード自身
#   - SAN がそのノードの名前・IP と一致するもの
# に限定されている。任意の証明書を発行できるわけではない。
# ===========================================================================

replicaCount: 2

# control-plane にも配置する（control-plane の kubelet も CSR を出すため）
tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule

affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchLabels:
            app.kubernetes.io/name: kubelet-serving-cert-approver
        topologyKey: kubernetes.io/hostname

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65534
  capabilities:
    drop: [ALL]
  seccompProfile:
    type: RuntimeDefault

metrics:
  enable: true
  serviceMonitor:
    enable: true
    additionalLabels:
      release: kube-prometheus-stack
