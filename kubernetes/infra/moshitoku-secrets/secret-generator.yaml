# ===========================================================================
# KSOPS ジェネレータ
#
# Argo CD の repo-server に組み込まれた ksops が、ここで指定した SOPS
# 暗号化ファイルを age 秘密鍵で復号して Secret を生成する。
# 鍵は repo-server に sops-age Secret としてマウントされている
# （kubernetes/bootstrap/argocd/values.yaml を参照）。
# ===========================================================================
apiVersion: viaduct.ai/v1
kind: ksops
metadata:
  name: moshitoku-secret-generator
  annotations:
    config.kubernetes.io/function: |
      exec:
        path: ksops
files:
  - scraper-runtime.sops.yaml
