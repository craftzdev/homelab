# ===========================================================================
# ceph-csi-rbd — Ceph RBD の CSI ドライバ
#
# 既存の Proxmox Ceph（外部クラスタ）に接続する。
# Rook を挟まない理由は docs/adr/0004-ceph-csi.md を参照。
# ===========================================================================

# ---------------------------------------------------------------------------
# 接続先の Ceph クラスタ
#
# clusterID は Ceph の fsid（`ceph fsid` で取得）。
# StorageClass の parameters.clusterID と一致していなければならない。
#
# monitors はポート 3300（msgr2）を指定する。6789（msgr1）ではなく
# msgr2 を使う理由:
#   - 認証と完全性チェックが強化されている
#   - 将来的に通信の暗号化（secure mode）を有効にできる
# Proxmox の Ceph 19.2.3 は両方でリッスンしていることを確認済み。
#
# ⚠️ ここは VLAN20（Ceph public）のアドレスである。Kubernetes ノードは
#    VLAN20 に直接接続された NIC を持つため、L3 ルータを経由しない
#    （docs/adr/0007-dual-nic-topology.md）。
# ---------------------------------------------------------------------------
csiConfig:
  - clusterID: "10f95430-060d-4bd2-9d93-db845d9c748f"
    monitors:
      - "172.16.20.11:3300"
      - "172.16.20.12:3300"
      - "172.16.20.13:3300"

# ---------------------------------------------------------------------------
# StorageClass は自前で定義する（storageclass.yaml）。
#
# chart に作らせないのは、複数の StorageClass（default / retain）を
# 定義したいことと、パラメータを明示的にレビューできる形で
# リポジトリに残したいため。
# ---------------------------------------------------------------------------
storageClass:
  create: false

# Secret も自前で管理する（SOPS 暗号化）
secret:
  create: false

# ---------------------------------------------------------------------------
# provisioner（コントロールプレーン側）
# ---------------------------------------------------------------------------
provisioner:
  replicaCount: 2

  # ボリュームのオンライン拡張を有効化
  resizer:
    enabled: true

  # VolumeSnapshot 対応
  snapshotter:
    enabled: true

  # 2 レプリカが同じノードに載らないようにする
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - ceph-csi-rbd-provisioner
          topologyKey: kubernetes.io/hostname

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

# ---------------------------------------------------------------------------
# nodeplugin（各ノードで動く DaemonSet）
# ---------------------------------------------------------------------------
nodeplugin:
  # Talos では kubelet のディレクトリが標準パスにある
  registrar:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi

  plugin:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi

  # control-plane にも配置する。
  # control-plane 上で動く system コンポーネントが PVC を使う可能性に備える。
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule

# ---------------------------------------------------------------------------
# 可観測性
# ---------------------------------------------------------------------------
serviceMonitor:
  enabled: true
  namespace: ceph-csi
  labels:
    release: kube-prometheus-stack

# ---------------------------------------------------------------------------
# ログレベル
#
# 既定の 5 は冗長でディスクを消費する。障害調査時のみ上げる。
# ---------------------------------------------------------------------------
logLevel: 1

# ---------------------------------------------------------------------------
# CSI ドライバ名。StorageClass の provisioner と一致させること。
# ---------------------------------------------------------------------------
driverName: rbd.csi.ceph.com
