---
apiVersion: v1
kind: Namespace
metadata:
  name: ingress-nginx
  labels:
    # ingress-nginx v1.15 は非特権で動作する（NET_BIND_SERVICE も不要）。
    # ただし chart の admission webhook patch ジョブなどが
    # restricted に抵触する場合があるため baseline とする。
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted

    app.kubernetes.io/name: ingress-nginx
    app.kubernetes.io/part-of: external-access

---
# ===========================================================================
# ingress-nginx の通信制限
#
# 「誰が ingress-nginx に入れるか」と「ingress-nginx がどこへ出られるか」を
# 制限する。特に後者が重要で、SSRF 型の攻撃で ingress-nginx を踏み台に
# 内部リソースへアクセスされることを防ぐ。
# ===========================================================================
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-deny
  namespace: ingress-nginx
spec:
  endpointSelector: {}
  ingress: []
  egress: []

---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: ingress-nginx-rules
  namespace: ingress-nginx
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: ingress-nginx

  ingress:
    # --- cloudflared からの転送（外部公開の唯一の経路）---
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: cloudflared
            app.kubernetes.io/name: cloudflared
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP

    # --- 宅内からの直接アクセス（LoadBalancer IP 経由）---
    #
    # Cilium の L2 Announcement で払い出した 172.16.40.200 に
    # 宅内から到達するケース。ノード経由で入ってくるため
    # host / remote-node エンティティとして扱われる。
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
            - port: "443"
              protocol: TCP
            - port: "10254" # health / metrics
              protocol: TCP

    # --- Prometheus によるメトリクス取得 ---
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports:
            - port: "10254"
              protocol: TCP

    # --- admission webhook（apiserver から呼ばれる）---
    - fromEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP

  egress:
    # --- DNS ---
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP

    # --- kube-apiserver（Ingress リソースの watch）---
    - toEntities:
        - kube-apiserver

    # -----------------------------------------------------------------------
    # --- バックエンド（クラスタ内の Pod）---
    #
    # ⚠️ ここが「どこへでも転送できる」状態だと、Ingress を作成できる
    #    権限を持つ者が任意の内部サービスへ到達できてしまう。
    #
    #    現状は全 Pod への転送を許可しているが、
    #    クラスタ全体の egressDeny（policies/clusterwide-egress-deny.yaml）
    #    により宅内ネットワークへは出られない。
    #
    #    公開アプリが確定したら、ここを具体的な namespace/label に
    #    絞り込むことを推奨する。
    # -----------------------------------------------------------------------
    - toEndpoints:
        - matchExpressions:
            - key: io.kubernetes.pod.namespace
              operator: Exists
