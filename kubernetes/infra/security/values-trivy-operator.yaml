# ===========================================================================
# Trivy Operator — 稼働中のイメージを継続的に脆弱性スキャンする
#
# 「デプロイ時にスキャンする」だけでは不十分である。脆弱性は
# デプロイ後に公表されるため、稼働中のイメージを定期的に再評価する
# 必要がある。Trivy Operator はそれを自動で行う。
# ===========================================================================

operator:
  # 脆弱性スキャンを有効化
  vulnerabilityScannerEnabled: true
  # Kubernetes リソースの設定不備（CIS 相当）をチェック
  configAuditScannerEnabled: true
  # RBAC の過剰権限を検出
  rbacAssessmentScannerEnabled: true
  # Pod の実行時設定（特権等）を検査
  infraAssessmentScannerEnabled: true
  # ClusterComplianceReport（CIS Benchmark）
  clusterComplianceEnabled: true

  # 公開済みの脆弱性情報が更新されるため、定期的に再スキャンする
  vulnerabilityScannerScanOnlyCurrentRevisions: true
  scanJobsConcurrentLimit: 2

  # スキャン結果の保持期間
  scanJobTTL: "10m"

  metricsFindingsEnabled: true

# ---------------------------------------------------------------------------
# 除外する namespace
#
# Trivy 自身と、スキャンしても意味の薄いものを除く。
# ⚠️ kube-system は除外しない。基盤コンポーネントこそ
#    脆弱性の影響が大きいため。
# ---------------------------------------------------------------------------
targetNamespaces: ""
excludeNamespaces: "security"

trivy:
  # -------------------------------------------------------------------------
  # 報告対象の深刻度
  #
  # LOW / MEDIUM まで含めると報告が膨大になり、本当に対処すべき
  # CRITICAL / HIGH が埋もれる。まず HIGH 以上に絞る。
  # -------------------------------------------------------------------------
  severity: "HIGH,CRITICAL"

  # 修正パッチが存在しない脆弱性は対処のしようがないため除外する
  ignoreUnfixed: true

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

  # ---------------------------------------------------------------------------
  # 脆弱性 DB の永続化について
  #
  # ⚠️ chart の `trivy.storageClassName` / `trivy.storageSize` は
  #    **trivy server モード（StatefulSet）専用**の設定であり、
  #    既定の standalone モードでは PVC が作られない。
  #    ここに書いても効果が無いため設定しない。
  #
  # standalone モードでは各スキャンジョブが DB をダウンロードする。
  # 外部への通信が発生するが、頻度は限定的（DB のキャッシュ有効期間内は再利用）。
  # スキャン対象が増えて通信量が問題になったら、
  # `trivy.mode: ClientServer` に切り替えて server モードを検討すること。
  # ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# スキャンジョブの securityContext
#
# ⚠️ 下の `securityContext:` は **operator 自身の Pod** に効く設定であり、
#    operator が起動する **スキャンジョブの Pod** には効かない。
#    スキャンジョブ側は trivyOperator.scanJobPodTemplate* で別途指定する。
#
# security namespace は pod-security.kubernetes.io/enforce=restricted。
# chart 0.34.0 の既定値は
#   scanJobPodTemplatePodSecurityContext: {}
#   scanJobPodTemplateContainerSecurityContext:
#     allowPrivilegeEscalation / capabilities / privileged / readOnlyRootFilesystem
# のみで、restricted が要求する runAsNonRoot と seccompProfile を満たさない。
#
# その結果 2026-09-16 時点で、スキャンジョブが Pod 作成の段階で拒否され続け、
# **VulnerabilityReport が 1 件も生成されていなかった**（ConfigAuditReport は
# 295 件あり、正常に見えていた）。実際のエラー:
#
#   pods "scan-vulnerabilityreport-..." is forbidden:
#     violates PodSecurity "restricted:latest":
#       runAsNonRoot != true (pod or containers "...", "database",
#         "data-permissions-ensurer" must set securityContext.runAsNonRoot=true),
#       seccompProfile (... must set securityContext.seccompProfile.type to
#         "RuntimeDefault" or "Localhost")
#
# さらに trivy_image_vulnerabilities メトリクスが存在しないため、
# alerts.yaml の HighSeverityVulnerabilityDetected は発火し得なかった。
# 経緯は docs/storage-migration-2026-09-13.md を参照。
#
# 📌 node-collector（CIS ベンチマーク用）は別問題で、ここでは直らない。
#    hostPID=true と 8 個の hostPath マウントを必要とし、
#    restricted とは設計上両立しない。namespace のハードニングを優先し、
#    node-collector は失敗したままとする（ClusterComplianceReport は得られない）。
#
# 📌 root が必要なのは filesystem / rootfs スキャンのときだけで、
#    ここで使うイメージスキャン（standalone）は非 root で動く。
# ---------------------------------------------------------------------------
trivyOperator:
  scanJobPodTemplatePodSecurityContext:
    runAsNonRoot: true
    runAsUser: 10000
    runAsGroup: 10000
    # emptyDir（Trivy の DB キャッシュ）へ非 root で書けるようにする
    fsGroup: 10000
    seccompProfile:
      type: RuntimeDefault
  # chart 既定値を明示的に再掲したうえで、不足している 2 項目を足す
  scanJobPodTemplateContainerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]
    privileged: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

serviceMonitor:
  enabled: true
  labels:
    release: kube-prometheus-stack

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  capabilities:
    drop: [ALL]
  seccompProfile:
    type: RuntimeDefault

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi
