apiVersion: v1
kind: Namespace
metadata:
  name: status
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: status
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]

---
# ===========================================================================
# Gatus の通信範囲
#
# ---------------------------------------------------------------------------
# egress をここまで絞る理由
# ---------------------------------------------------------------------------
# Gatus は「外部の URL へ出ていくことが仕事」の Pod である。侵害された
# 場合、外向き通信が正常な挙動と区別しにくい。だからこそ、出ていける先を
# 監視対象そのものだけに限定しておく価値がある。
#
# ⚠️ clusterwide-egress-deny は以前 `toEntities: all` を全対象 namespace に
#    与えていたため、status namespace はその対象から外していた。現在の
#    CCNP は deny だけを加え何も許可しないので、status も対象に戻した。
#    ここに書いた許可リストがそのまま egress の上限になる。
#
# 監視対象を増やすときは、Gatus の config と下の toFQDNs を
# **同じ PR で** 更新する。片方だけでは監視が無言で失敗する。
# ===========================================================================
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: gatus-rules
  namespace: status
spec:
  endpointSelector: {}

  ingress:
    # Tailscale Ingress proxy から UI へ
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: tailscale
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # Prometheus の /metrics 収集
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # kubelet の liveness / readiness probe はノード側から届く
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP

  egress:
    # -----------------------------------------------------------------------
    # CoreDNS
    #
    # toFQDNs を使うため、DNS 応答を Cilium の DNS proxy に見せる必要がある。
    # rules.dns が無いと名前から IP への対応が学習されず、下の toFQDNs が
    # 一致しなくなる。
    #
    # 以前はここが matchPattern: "*" だった。任意の名前を解決できるという
    # ことは、443 を一切使わずに DNS クエリだけでデータを持ち出せるという
    # ことでもある。監視対象の名前だけに絞る。
    #
    # ⚠️ 監視対象を増やすときは、ここの matchName、下の toFQDNs、Gatus の
    #    config の 3 箇所を同じ PR で更新する。どれか 1 つでも漏れると
    #    監視が無言で失敗する。
    # -----------------------------------------------------------------------
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchName: gateway.craftz.dev
              - matchName: moshitoku.com
              - matchName: www.moshitoku.com

    # -----------------------------------------------------------------------
    # 監視対象の公開 FQDN へ HTTPS
    #
    # ⚠️ これは「監視対象だけに到達できる」ことを意味しない。
    #
    #    toFQDNs は DNS 応答から学習した **IP** を許可する L3/L4 の仕組みで
    #    あり、TLS の SNI は見ていない。gateway.craftz.dev は Cloudflare の
    #    共有 anycast（172.64.0.0/13 等）に解決するため、ここで許可される
    #    IP は「Cloudflare の背後にある全サイト」と同じである。侵害された
    #    Pod は同じ IP へ別ドメインの SNI で接続できる。
    #
    #    したがって、CDN の背後にあるホストを監視対象にしている限り、この
    #    ルールは「任意の Cloudflare 配下サイトへの 443」と大差ない。
    #    下の egressDeny が実際の硬い境界である。
    # -----------------------------------------------------------------------
    - toFQDNs:
        - matchName: gateway.craftz.dev
        - matchName: moshitoku.com
        - matchName: www.moshitoku.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP

  # ---------------------------------------------------------------------------
  # 宅内ネットワークへの deny
  #
  # clusterwide-egress-deny と同じ宅内 CIDR の deny を、この namespace の
  # ポリシーにも明示しておく（status を CCNP から外していた時期の名残だが、
  # 二重に掛かっていて害はない）。
  #
  # toFQDNs は DNS 応答を信頼するため、応答が攻撃者に操作されれば宅内の IP が
  # 443 の許可対象になりうる。その場合でもこの deny が勝つ。
  #
  # ⚠️ 10.0.0.0/8 は Pod / Service ネットワークなので deny しない。
  #    ここへ足すと CoreDNS への問い合わせごと落ちる。
  # ---------------------------------------------------------------------------
  egressDeny:
    - toCIDR:
        # Proxmox VE / PBS
        - 172.16.10.0/24
        # Ceph public / cluster（廃止済みだが経路は塞いだままにする）
        - 172.16.20.0/24
        - 172.16.30.0/24
        # 宅内セグメント
        - 192.168.0.0/16
        # Tailscale（CGNAT 帯）
        - 100.64.0.0/10
        # リンクローカル / メタデータサービス（SSRF の常套手段）
        - 169.254.0.0/16
