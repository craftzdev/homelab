apiVersion: apps/v1
kind: Deployment
metadata:
  name: pbs-observer
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pbs-observer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pbs-observer
    spec:
      automountServiceAccountToken: false
      hostAliases:
        - ip: "172.16.10.51"
          hostnames: ["pbs.home.arpa"]
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: exporter
          # Pinned by digest, as the other workloads are. A retagged
          # 3.13-slim would otherwise replace the runtime with no Git diff.
          image: python:3.13-slim-bookworm@sha256:ed86c82274b3c69b52fb5820f358f0bd7df0b603332063cb5c6e32bd220c3e6e
          command: ["python3", "-B", "/app/exporter.py"]
          ports:
            - name: metrics
              containerPort: 9099
          env:
            # pbs-observer-credentials is not in Git; it is provisioned by
            # scripts/reconcile-pbs-monitoring-token.py. Until that has run,
            # this pod stays in CreateContainerConfigError.
            - name: PBS_TOKEN_ID
              valueFrom:
                secretKeyRef:
                  name: pbs-observer-credentials
                  key: PBS_TOKEN_ID
            - name: PBS_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: pbs-observer-credentials
                  key: PBS_TOKEN_SECRET
            # The observer has its own Proxmox identity rather than sharing
            # Homepage's: rotation stays independent and the PVE task log can
            # tell the two apart. Provisioned by
            # scripts/reconcile-pve-monitoring-token.sh.
            - name: PVE_TOKEN_ID
              valueFrom:
                secretKeyRef:
                  name: pbs-observer-pve-credentials
                  key: PVE_TOKEN_ID
            - name: PVE_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: pbs-observer-pve-credentials
                  key: PVE_TOKEN_SECRET
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 10
          volumeMounts:
            - name: pbs-ca
              mountPath: /etc/pbs-ca
              readOnly: true
            - name: code
              mountPath: /app
              readOnly: true
            - name: ca
              mountPath: /etc/pve-ca
              readOnly: true
      volumes:
        - name: pbs-ca
          configMap:
            name: pbs-observer-ca
        - name: code
          configMap:
            name: pbs-observer-code
        - name: ca
          configMap:
            name: homepage-pve-ca
---
apiVersion: v1
kind: Service
metadata:
  name: pbs-observer
  labels:
    app.kubernetes.io/name: pbs-observer
spec:
  selector:
    app.kubernetes.io/name: pbs-observer
  ports:
    - name: metrics
      port: 9099
      targetPort: metrics
