# ===========================================================================
# ArgoCD AppProject
#
# Project は「この Application 群が何をしてよいか」の境界を定義する。
# default プロジェクトは何でも許可してしまうため使わない。
# ===========================================================================
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: infrastructure
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: |
    クラスタの基盤コンポーネント（CNI / CSI / Ingress / 監視 / バックアップ）。
    アプリケーションのデプロイには別の Project を作ること。

  # -------------------------------------------------------------------------
  # 許可するソースリポジトリ
  #
  # ⚠️ "*" にしないこと。任意のリポジトリからマニフェストを取り込めると、
  #    Application リソースを作れる者が任意のワークロードを
  #    デプロイできてしまう。
  # -------------------------------------------------------------------------
  sourceRepos:
    - https://github.com/craftzdev/homelab.git
    # Helm chart のリポジトリ（明示的に列挙する）
    - https://helm.cilium.io/
    - https://ceph.github.io/csi-charts
    - https://kubernetes.github.io/ingress-nginx
    - https://charts.jetstack.io
    - https://prometheus-community.github.io/helm-charts
    - https://vmware-tanzu.github.io/helm-charts
    - https://aquasecurity.github.io/helm-charts/
    - https://backube.github.io/helm-charts/
    - https://alex1989hu.github.io/kubelet-serving-cert-approver

  # -------------------------------------------------------------------------
  # デプロイ先の namespace
  #
  # 基盤コンポーネントが使う namespace のみを列挙する。
  # ここに無い namespace へはデプロイできない。
  # -------------------------------------------------------------------------
  destinations:
    - server: https://kubernetes.default.svc
      namespace: kube-system
    - server: https://kubernetes.default.svc
      namespace: ceph-csi
    - server: https://kubernetes.default.svc
      namespace: ingress-nginx
    - server: https://kubernetes.default.svc
      namespace: cloudflared
    - server: https://kubernetes.default.svc
      namespace: cert-manager
    - server: https://kubernetes.default.svc
      namespace: monitoring
    - server: https://kubernetes.default.svc
      namespace: velero
    - server: https://kubernetes.default.svc
      namespace: security
    - server: https://kubernetes.default.svc
      namespace: argocd

  # -------------------------------------------------------------------------
  # クラスタスコープのリソース
  #
  # 基盤コンポーネントは CRD / ClusterRole / StorageClass 等を必要とする。
  # ただし何でも許すのではなく、必要なものを列挙する。
  # -------------------------------------------------------------------------
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: storage.k8s.io
      kind: StorageClass
    - group: storage.k8s.io
      kind: CSIDriver
    - group: snapshot.storage.k8s.io
      kind: VolumeSnapshotClass
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
    - group: apiregistration.k8s.io
      kind: APIService
    - group: cilium.io
      kind: CiliumClusterwideNetworkPolicy
    - group: cilium.io
      kind: CiliumLoadBalancerIPPool
    - group: cilium.io
      kind: CiliumL2AnnouncementPolicy
    - group: scheduling.k8s.io
      kind: PriorityClass
    - group: policy
      kind: PodSecurityPolicy
    - group: node.k8s.io
      kind: RuntimeClass

  # -------------------------------------------------------------------------
  # 名前空間スコープで禁止するリソース
  #
  # ⚠️ 基盤コンポーネントが ResourceQuota / LimitRange を勝手に作ると、
  #    他のワークロードに予期しない制約が掛かる。
  # -------------------------------------------------------------------------
  namespaceResourceBlacklist:
    - group: ""
      kind: ResourceQuota
    - group: ""
      kind: LimitRange

  # 誰がこの Project の Application を操作できるか
  roles:
    - name: readonly
      description: 参照のみ
      policies:
        - p, proj:infrastructure:readonly, applications, get, infrastructure/*, allow
