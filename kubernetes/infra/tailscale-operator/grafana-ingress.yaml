apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
  namespace: monitoring
  annotations:
    # Grafana is a privileged management UI, so it intentionally shares the
    # existing admin-only Tailnet identity policy with Argo CD.
    tailscale.com/tags: tag:argocd
    tailscale.com/proxy-class: restricted-userspace
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: kube-prometheus-stack-grafana
      port:
        name: http-web
  tls:
    - hosts:
        - grafana
