      targetRevision: 0.14.2
      helm:
        releaseName: arc-controller
        valueFiles:
          - $values/kubernetes/infra/actions-runner-controller/controller-values.yaml
    - repoURL: https://github.com/craftzdev/homelab.git
      targetRevision: main
      path: kubernetes/infra/actions-runner-controller
      directory:
        include: '{namespace-and-policy.yaml,harbor-ci-proxy.yaml}'
    - repoURL: https://github.com/craftzdev/homelab.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: arc-systems
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
