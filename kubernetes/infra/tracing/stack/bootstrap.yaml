apiVersion: v1
kind: ConfigMap
metadata:
  name: minio-tempo-policy
  namespace: logging
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
data:
  policy.json: |
    {
      "Version": "2012-10-17",
      "Statement": [
        {
          "Effect": "Allow",
          "Action": ["s3:GetBucketLocation", "s3:ListBucket", "s3:ListBucketMultipartUploads"],
          "Resource": ["arn:aws:s3:::tempo-traces"]
        },
        {
          "Effect": "Allow",
          "Action": ["s3:GetObject", "s3:PutObject", "s3:DeleteObject", "s3:GetObjectTagging",
                     "s3:PutObjectTagging", "s3:AbortMultipartUpload", "s3:ListMultipartUploadParts"],
          "Resource": ["arn:aws:s3:::tempo-traces/*"]
        }
      ]
    }
---
# A Sync hook runs after policies and before Tempo. No hourly bootstrap race.
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-tempo-bootstrap
  namespace: logging
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio-tempo-bootstrap
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bootstrap
          image: docker.io/pgsty/mc:RELEASE.2026-03-13T08-57-32Z
          command: ["/bin/sh", "-ec"]
          args:
            - |
              mc alias set local http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" >/dev/null
              mc mb --ignore-existing local/tempo-traces >/dev/null
              mc anonymous set none local/tempo-traces >/dev/null
              mc admin user add local "$AWS_ACCESS_KEY_ID" "$AWS_SECRET_ACCESS_KEY" >/dev/null
              mc admin policy create local tempo-readwrite /etc/minio/policy.json >/dev/null
              mc admin policy attach local tempo-readwrite --user "$AWS_ACCESS_KEY_ID" >/dev/null
              # Fixed lifecycle ID makes repeated synchronization idempotent.
              mc ilm rule add --id tempo-incomplete --abort-incomplete-multipart-upload-days 1 local/tempo-traces >/dev/null
              echo "Tempo bucket and least-privilege credentials reconciled"
          envFrom:
            - secretRef:
                name: tempo-s3-credentials
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-root-credentials
                  key: root-user
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-root-credentials
                  key: root-password
            - name: MC_CONFIG_DIR
              value: /tmp/.mc
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: policy
              mountPath: /etc/minio
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: policy
          configMap:
            name: minio-tempo-policy
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
