# ===========================================================================
# ホームラボ固有のアラート
#
# kube-prometheus-stack の既定ルールに加え、この構成特有の
# 「壊れると困るもの」を監視する。
# ===========================================================================
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: homelab-rules
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    # -----------------------------------------------------------------------
    # ストレージ
    # -----------------------------------------------------------------------
    - name: homelab.storage
      rules:
        - alert: PersistentVolumeFillingUp
          expr: |
            (kubelet_volume_stats_available_bytes / kubelet_volume_stats_capacity_bytes) < 0.10
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} の空き容量が 10% を切りました"

        # -------------------------------------------------------------------
        # ゲストから見たディスク書き込み遅延
        #
        # 容量ではなく「遅さ」を見る。2026-09-13 のストレージ障害では、
        # ZFS プールが一度も TRIM されておらず SATA SSD が GC で飽和し、
        # ゲストの平均書き込み遅延がこうなっていた（実測）:
        #
        #   k8s-worker-1  54,449 ms      k8s-worker-2  41,997 ms
        #   k8s-worker-3   5,495 ms      control-plane 3台  0-1 ms
        #                                （control は NVMe なので影響なし）
        #
        # 平常時は 0-3 ms。取れていた値に対してアラートが無かったため、
        # 数時間誰も気づかなかった。
        # 経緯は docs/storage-migration-2026-09-13.md を参照。
        # -------------------------------------------------------------------
        #
        # ---------------------------------------------------------------
        # 閾値の決め方（2026-09-16、24時間 288 サンプルの実測）
        #
        # 単純な閾値では分離できなかった。ゲストから見た値には Longhorn の
        # 複製往復と LUKS 層が含まれ、CI やイメージスキャンの最中は数秒に
        # 達するのが正常である（直近6時間のピーク 9.8 s）。
        #
        #   閾値      24h誤検知    09-13障害時の一致
        #   > 0.1 s   45/288       -          ← 常時鳴る。無視されるだけ
        #   > 1   s   28/288       18/19
        #   > 10  s    0/288        2/19      ← 誤検知は無いが障害も拾えない
        #
        # そこで「瞬間値」ではなく「30分間一度も下回らなかったか」で見る。
        # スパイクと持続的劣化が分離できる。
        #
        #   min_over_time(...[30m:1m]) > 0.5   →  1/288    13/19
        #   min_over_time(...[30m:1m]) > 1     →  0/288     5/19
        #
        # ⚠️ さらに「書き込みが実際に起きていること」を条件に加える。
        #    これが無いと、ほぼアイドルなボリュームで誤検知する。
        #    2026-09-16 に worker-3 の sdj（Longhorn ボリューム）で発火したが、
        #    直近 1 時間のピークが **0.026 IOPS**（約 39 秒に 1 回）で、
        #    散発的な遅い書き込みを 5 分レートの窓が持ち回っていただけだった。
        #    実害は無い。
        #
        #    障害時に遅かったデバイスは 1.4〜4.0 IOPS 出ていたので、
        #    0.5 IOPS の下限なら取りこぼさない（20 倍以上の余裕）。
        #    24h 誤検知: ガード無し 4/288 → ガード有り 1/288。
        #
        # ⚠️ critical の閾値は 1s ではなく 800ms。ガードを入れると 1s では
        #    09-13 の障害を一度も拾えなかった（1s を 30 分継続していたのは
        #    IOPS がガードを下回るデバイスだけだった）。800ms なら
        #    24h 誤検知 0/288 のまま worker-1 で 7 サンプル発火する。
        #    「鳴らない critical」に意味は無いので下げた。
        #
        # dm-* を除くのは、LUKS/device-mapper が下位デバイスの I/O を
        # そのまま二重計上するため。
        #
        # ⚠️ この指標は物理ディスクの遅延そのものではない。
        #    本来は Proxmox ホスト（172.16.10.11-13）を node_exporter で
        #    直接スクレイプすべきだが、現状は監視対象外である。
        #    経緯は docs/storage-migration-2026-09-13.md を参照。
        # ---------------------------------------------------------------
        - alert: NodeDiskWriteLatencyHigh
          expr: |
            (
              min_over_time(
                (
                  rate(node_disk_write_time_seconds_total{device!~"dm-.*"}[5m])
                    / rate(node_disk_writes_completed_total{device!~"dm-.*"}[5m])
                )[30m:1m]
              ) > 0.5
            )
            and
            (
              min_over_time(
                rate(node_disk_writes_completed_total{device!~"dm-.*"}[5m])[30m:1m]
              ) > 0.5
            )
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.instance }} の {{ $labels.device }} の書き込み遅延が 30 分以上 500ms を下回っていません"
            description: |
              一時的な負荷ではなく、持続的な劣化を示す。
              まず物理ホスト側の ZFS プールを疑う。
              確認: ssh root@172.16.10.1X 'zpool status -t local-zfs | grep sda'
              (untrimmed) なら zpool trim を検討する。
              あわせて autotrim と org.debian:periodic-trim も確認:
                scripts/reconcile-proxmox-zfs-trim.sh

        - alert: NodeDiskWriteLatencyCritical
          # この水準が続くと Longhorn の再構築が RPC タイムアウトで落ち始め、
          # 失敗と再試行が自己増幅ループになる。
          expr: |
            (
              min_over_time(
                (
                  rate(node_disk_write_time_seconds_total{device!~"dm-.*"}[5m])
                    / rate(node_disk_writes_completed_total{device!~"dm-.*"}[5m])
                )[30m:1m]
              ) > 0.8
            )
            and
            (
              min_over_time(
                rate(node_disk_writes_completed_total{device!~"dm-.*"}[5m])[30m:1m]
              ) > 0.5
            )
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.instance }} の {{ $labels.device }} の書き込み遅延が 30 分以上 800ms を下回っていません"
            description: |
              この水準では Longhorn のレプリカ再構築が完走できない。
              再構築の連打は回復を妨げるため、まず止めることを検討する:
                kubectl -n longhorn-system patch settings.longhorn.io \
                  concurrent-replica-rebuild-per-node-limit --type=merge -p '{"value":"0"}'
              その際は ArgoCD の longhorn app の自動同期も一時停止しないと戻される。

    # -----------------------------------------------------------------------
    # Longhorn
    #
    # 2026-09-13 の障害では、レプリカ再構築が失敗し続けて縮退ボリュームが
    # 3 → 7 個に増え、Prometheus / Loki / MinIO がコピー 1 個まで減っていた。
    # いずれも worker-3 に集中しており、同ノードには CNPG 両クラスタの主系も
    # 載っていた。1 筐体の喪失で DB 主系と DB バックアップ先を同時に失う
    # 状態だったが、**Longhorn のメトリクスは 1 つも収集されていなかった**
    # （ServiceMonitor が CRD 導入前の TODO のまま無効だった）。
    # 経緯は docs/storage-migration-2026-09-13.md を参照。
    #
    # メトリクスの形（2026-09-16 実測）:
    #   longhorn_volume_robustness{volume,pvc,pvc_namespace,node,state}
    #     state ごとの one-hot。該当状態が 1、それ以外が 0。
    #     state は healthy / degraded / faulted / unknown。
    #   longhorn_replica_state{volume,replica,node,state}  state=running 等
    #   longhorn_node_status{node,condition}  condition=ready/schedulable/...
    #
    # ⚠️ レプリカ数 1 は異常ではない。CNPG の 6 ボリュームは
    #    longhorn-cnpg-retain で意図的にレプリカ 1（冗長化は PostgreSQL の
    #    3 インスタンスが担う）。そのため「実レプリカ数」ではなく
    #    robustness（希望数を満たしているか）で判定する。
    # -----------------------------------------------------------------------
    - name: homelab.longhorn
      rules:
        - alert: LonghornVolumeDegraded
          # 再構築中は一時的に degraded になる。30 分続く場合は
          # 「再構築が進んでいない」ことを意味する。
          expr: |
            longhorn_volume_robustness{state="degraded"} == 1
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Longhorn ボリューム {{ $labels.pvc_namespace }}/{{ $labels.pvc }} が 30 分以上 degraded です"
            description: |
              再構築が完走していない可能性がある。まず失敗理由を見る:
                kubectl -n longhorn-system get events --field-selector reason=FailedRebuilding
              再試行上限（rebuildRetryCount=5）に達していると Longhorn は
              諦めて放置する。その場合は healthyAt が空で engine の
              replicaAddressMap にも居ない空レプリカを削除して作り直させる。
              ディスク遅延が原因のことも多い。NodeDiskWriteLatency* も確認。

        - alert: LonghornVolumeDegradedSingleReplica
          # 希望数を下回っており、かつ実際に動いているコピーが 1 個しかない。
          # 次に 1 つ失うとデータが無くなる。
          expr: |
            (longhorn_volume_robustness{state="degraded"} == 1)
              and on (volume)
            (count by (volume) (longhorn_replica_state{state="running"} == 1) < 2)
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "Longhorn ボリューム {{ $labels.pvc_namespace }}/{{ $labels.pvc }} のコピーが 1 個しかありません"
            description: |
              次に 1 つ失うとデータが失われる。残っているコピーのノードを
              再起動・drain・退避の対象から外すこと。
                kubectl -n longhorn-system get replicas.longhorn.io \
                  -o custom-columns=N:.metadata.name,V:.spec.volumeName,NODE:.spec.nodeID,S:.status.currentState

        - alert: LonghornVolumeFaulted
          expr: |
            longhorn_volume_robustness{state="faulted"} == 1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Longhorn ボリューム {{ $labels.pvc_namespace }}/{{ $labels.pvc }} が faulted です"
            description: |
              正常なレプリカが 1 つも無く、ボリュームは読み書きできない。

        - alert: LonghornNodeNotReady
          expr: |
            longhorn_node_status{condition="ready"} == 0
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "Longhorn ノード {{ $labels.node }} が Ready ではありません"

        - alert: LonghornNodeNotSchedulable
          # 容量不足やノードの cordon で新しいレプリカを置けない。
          # 縮退したまま復旧できなくなる。
          expr: |
            longhorn_node_status{condition="schedulable"} == 0
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Longhorn ノード {{ $labels.node }} に新しいレプリカを配置できません"

        - alert: LonghornDiskFillingUp
          expr: |
            longhorn_disk_usage_bytes / longhorn_disk_capacity_bytes > 0.75
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Longhorn ディスク {{ $labels.node }} の使用率が 75% を超えています"
            description: |
              空きが減るとレプリカを配置できなくなり、縮退から復旧できなくなる。

    # -----------------------------------------------------------------------
    # Proxmox ホストのストレージ
    #
    # 2026-09-13 の障害を診断できた指標は、いずれもホスト側にしか無かった。
    # ゲスト（172.16.40.x）の node_exporter が見せる遅延には Longhorn の
    # 複製往復と LUKS が含まれ、物理ディスクの値とは別物である。
    # 当時 Prometheus はホスト（172.16.10.x）を一切見ていなかった。
    #
    # 取り込み経路（clusterwide egress deny を迂回しないための設計）:
    #   Proxmox ホスト
    #     prometheus-node-exporter        … 物理ディスクの I/O カウンタ
    #     zfs-textfile-collector.timer    … TRIM 状態・txg 同期時間
    #       （どちらも node_exporter の ZFS collector には無い）
    #   → portal/pbs-observer が 9100 を読み、必要な系列だけ pve_ 接頭辞で再出力
    #   → Prometheus は従来どおり pbs-observer だけをスクレイプ
    #
    # 導入は scripts/reconcile-proxmox-node-exporter.sh。
    # 経緯は docs/storage-migration-2026-09-13.md を参照。
    # -----------------------------------------------------------------------
    - name: homelab.proxmox-storage
      rules:
        - alert: ProxmoxZFSPoolUntrimmed
          # これが今回の根本原因そのもの。Debian の月次 TRIM は既定で
          # NVMe 専用プールしか対象にせず、SATA プールは永久に飛ばされる。
          # プール作成から 7 日で Longhorn の再構築が完走できなくなった。
          expr: |
            pve_zfs_pool_trim_state{state="untrimmed"} == 1
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.pve_node }} の {{ $labels.pool }}/{{ $labels.device }} が一度も TRIM されていません"
            description: |
              SSD の FTL が空きブロックを認識できず、GC で飽和して
              書き込み遅延が桁違いに悪化する。
                scripts/reconcile-proxmox-zfs-trim.sh --apply --trim-now
              Longhorn のコピーが 1 個しかないボリュームがある状態では
              実行しないこと。

        - alert: ProxmoxZFSPeriodicTrimDisabled
          # untrimmed そのものより先に出る予兆。設定漏れを検知する。
          expr: |
            pve_zfs_pool_periodic_trim_enabled == 0
          for: 6h
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.pve_node }} の {{ $labels.pool }} は月次 TRIM の対象外です"
            description: |
              org.debian:periodic-trim が enable でないため、
              /etc/cron.d/zfsutils-linux は毎月起動しても何もしない
              （既定の auto は NVMe 専用プールのみ対象）。
                scripts/reconcile-proxmox-zfs-trim.sh --apply

        - alert: ProxmoxZFSAutotrimDisabled
          expr: |
            pve_zfs_pool_autotrim == 0
          for: 6h
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.pve_node }} の {{ $labels.pool }} で autotrim が無効です"
            description: |
              月次 TRIM だけでは間に合わない（7 日で壊滅した実績がある）。
                scripts/reconcile-proxmox-zfs-trim.sh --apply

        - alert: ProxmoxZFSTxgSyncSlow
          # txg の同期が詰まると、その上のすべての書き込みが待たされる。
          # 障害時は 95MB に 51.8 秒、ピークで 154.7 秒。
          # CI 負荷下の平常値は 13.6 秒だったため 30 秒を境にする。
          # 指標は直近約 8 分（98 txg）の最大値。
          expr: |
            pve_zfs_pool_txg_sync_seconds_max > 30
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.pve_node }} の {{ $labels.pool }} で txg 同期に 30 秒以上かかっています"
            description: |
              この水準では Longhorn のレプリカ再構築が完走できない。
              まず TRIM 状態を疑う（pve_zfs_pool_trim_state）。

        - alert: ProxmoxHostDiskWriteLatencyHigh
          # ホスト側なので Longhorn も LUKS も挟まらない、物理ディスクの値。
          # 平常時 1ms 未満、障害時 190-319ms。ゲスト側の代理指標より鋭い。
          #
          # ⚠️ device の絞り込みを外さないこと。エクスポーター側でも
          #    zd*/dm-*/loop* は落としているが、ここでも明示しておく。
          #    zvol は下位デバイスの I/O を別名で二重計上し、2026-09-16 の
          #    実測では最大 73ms（物理 sda は 0-10ms）と一桁遅く見えていた。
          #    絞らないとこの閾値は zvol で誤検知する。
          expr: |
            rate(pve_node_disk_write_time_seconds_total{device=~"sd.*|nvme.*"}[5m])
              / rate(pve_node_disk_writes_completed_total{device=~"sd.*|nvme.*"}[5m]) > 0.05
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.pve_node }} の {{ $labels.device }} の物理書き込み遅延が 50ms を超えています"
            description: |
              SSD なら 1ms 未満が正常。TRIM 状態と ZFS の txg 同期時間を確認する。

        - alert: ProxmoxZFSPoolNotOnline
          expr: |
            pve_zfs_pool_health == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.pve_node }} の {{ $labels.pool }} が ONLINE ではありません"

    # -----------------------------------------------------------------------
    # CloudNativePG のバックアップ
    #
    # 2026-09-16 時点で、DB のバックアップは唯一の代替不能なデータである。
    # Longhorn の実データ 46.2 GiB のうち、失って困るのは
    # MinIO 内の moshitoku-postgres 200MB と umami-postgres 31MB だけで、
    # 残りは監視データ（保持 15 日の時系列）とコンテナイメージ（再ビルド可）。
    #
    # ⚠️ 動くのは barman_cloud_* の方。`cnpg_collector_last_available_backup_timestamp`
    #    は barman-cloud プラグイン構成では常に 0 で、これを使ったアラートは
    #    一度も発火しない（本セッションで 3 度繰り返した失敗の形）。
    #
    # ⚠️ WAL のアーカイブ間隔では判定しない。書き込みが無い DB は
    #    正当に WAL を出さない。実測で umami は 4.2 日アーカイブ無しだったが、
    #    これは website_event が 0 行（計測データを受けていない）ためで
    #    バックアップの異常ではない。失敗カウンタの増加で見る。
    # -----------------------------------------------------------------------
    - name: homelab.cnpg-backup
      rules:
        - alert: CNPGBackupStale
          # 日次スケジュール（18:30 / 19:00 UTC）なので 36h は 1 回以上の欠測。
          expr: |
            time() - max by (namespace) (
              barman_cloud_cloudnative_pg_io_last_available_backup_timestamp > 0
            ) > 36 * 3600
          for: 30m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.namespace }} の DB バックアップが 36 時間以上更新されていません"
            description: |
              確認: kubectl -n {{ $labels.namespace }} get backups.postgresql.cnpg.io
              バックアップ先の疎通も見る（ObjectStore の destinationPath / endpointURL）。

        - alert: CNPGBackupFailing
          # 直近の試行が失敗し、成功より新しい状態。
          expr: |
            max by (namespace) (barman_cloud_cloudnative_pg_io_last_failed_backup_timestamp)
              > max by (namespace) (barman_cloud_cloudnative_pg_io_last_available_backup_timestamp)
          for: 1h
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.namespace }} の DB バックアップが失敗しています"

        - alert: CNPGNoBackupEver
          # ObjectStore を差し替えた直後に、新しい保存先へ一度も書けていない状態を捕まえる。
          expr: |
            max by (namespace) (barman_cloud_cloudnative_pg_io_last_available_backup_timestamp) == 0
          for: 6h
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.namespace }} にはバックアップが 1 つも存在しません"
            description: |
              バックアップ先を切り替えた直後は特にこれを確認すること。
              新しい保存先へ一度も書けていない場合、古い保存先の中身は
              もう更新されていない。

        - alert: CNPGRetentionNotEnforced
          # 保持ポリシーが「適用されているつもりで削除できていない」状態を捕まえる。
          #
          # retentionPolicy は 7d。正常なら first_recoverability_point は
          # 7 日前あたりで頭打ちになる。削除に失敗し続けると際限なく古くなる。
          #
          # ⚠️ これは R2 のバケットロックを有効にしたときの検証手段でもある。
          #    ロックは「保持期間内の削除と上書き」を禁じるため、保持期間の
          #    起点と経過後の扱いを誤ると barman が古いバックアップを
          #    消せなくなる。Cloudflare のドキュメントには
          #      - 保持の起点がアップロード時刻か
          #      - 期間経過後に通常どおり削除できるか
          #    が明記されていない（2026-09-16 時点）。
          #    バケットロックを入れたら 8〜10 日後にこのアラートが
          #    鳴らないことを確認する。鳴ったらロックルールを外す。
          #
          # 10d にしているのは 7d の保持に対する余裕。バックアップが
          # 数日止まっても即座には鳴らない。
          expr: |
            time() - max by (namespace) (
              barman_cloud_cloudnative_pg_io_first_recoverability_point > 0
            ) > 10 * 86400
          for: 6h
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.namespace }} の最古の復旧可能時点が 10 日以上前です"
            description: |
              retentionPolicy は 7d なので、正常なら 7 日前あたりで頭打ちになる。
              古いバックアップを削除できていない可能性がある。
                - R2 バケットロックを入れた直後なら、それが原因の可能性が高い
                - barman のサイドカーログで retention の失敗を確認する:
                    kubectl -n {{ $labels.namespace }} logs <pod> -c plugin-barman-cloud | grep -i retention
              放置しても即座に困りはしない（1 バックアップ約 25MB、R2 無料枠 10GB）が、
              保持ポリシーが機能していないこと自体が想定と食い違っている。

        - alert: CNPGWALArchiveFailing
          # WAL がアーカイブできないと、PITR の連続性が切れる。
          # 放置すると pg_wal が溜まり続けて PVC を埋める。
          expr: |
            increase(cnpg_pg_stat_archiver_failed_count[1h]) > 0
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.pod }} で WAL のアーカイブが失敗しています"
            description: |
              確認: kubectl -n {{ $labels.namespace }} exec {{ $labels.pod }} -c postgres -- \
                psql -c 'select * from pg_stat_archiver'
              バックアップ先が外部（R2）の場合、外向き通信の疎通も確認する。

    # -----------------------------------------------------------------------
    # セキュリティ
    # -----------------------------------------------------------------------
    - name: homelab.security
      rules:
        - alert: HighSeverityVulnerabilityDetected
          # Trivy Operator が Critical の脆弱性を検出した
          expr: |
            sum(trivy_image_vulnerabilities{severity="Critical"}) > 0
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Critical の脆弱性を持つイメージが稼働しています"
            description: |
              確認: kubectl get vulnerabilityreports -A
              イメージを更新してください（Renovate の PR を確認）。

        - alert: NetworkPolicyDropSpike
          # Cilium が大量にパケットを drop している = ポリシーの誤設定か
          # 攻撃の兆候。どちらにせよ調査が必要。
          expr: |
            sum(rate(cilium_drop_count_total[5m])) > 100
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Cilium のパケット drop が急増しています"
            description: |
              ポリシーの設定ミス、または不正なアクセスの可能性があります。
              確認: hubble observe --verdict DROPPED --last 100

    # -----------------------------------------------------------------------
    # Talos / クラスタ基盤
    # -----------------------------------------------------------------------
    - name: homelab.cluster
      rules:
        - alert: EtcdMemberLost
          # control-plane 3 台構成なので、2 台になると次の 1 台の障害で
          # クォーラムを失う。早めに気づく必要がある。
          expr: |
            count(kube_node_role{role="control-plane"}) < 3
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "control-plane ノードが 3 台未満です"
            description: |
              あと 1 台失うと etcd のクォーラムを失い、クラスタが停止します。
              確認: talosctl -n 172.16.40.11 get members

        - alert: NodeDiskEncryptionMissing
          # 想定外の設定変更を検知するための保険
          expr: |
            absent(node_filesystem_size_bytes{mountpoint="/var"})
          for: 30m
          labels:
            severity: info
          annotations:
            summary: "ノードの /var メトリクスが取得できません"

    # -----------------------------------------------------------------------
    # 監視自体の健全性
    #
    # 外部ターゲット（Gateway VM / PBS observer）は ServiceMonitor の設定変更や
    # CRD のバージョン差で「エラーを出さずにターゲットごと消える」ことがある。
    # 消えたことを検知できないと、グラフが空のまま「正常」に見えてしまう。
    # -----------------------------------------------------------------------
    - name: homelab.monitoring
      rules:
        - alert: AIGatewayTargetMissing
          expr: |
            absent(up{job="ai-gateway"})
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "ai-gateway のスクレイプ対象が存在しません"
            description: |
              ServiceMonitor / EndpointSlice、または Gateway 側の node exporter を確認。
              確認: kubectl -n monitoring get servicemonitor ai-gateway endpointslice ai-gateway-metrics

        - alert: PBSObserverTargetMissing
          expr: |
            absent(up{job="pbs-observer"})
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "pbs-observer のスクレイプ対象が存在しません"
            description: |
              確認: kubectl -n portal get deploy,svc -l app.kubernetes.io/name=pbs-observer

        - alert: BackupTelemetryCollectionFailing
          # 収集が失敗している間は、バックアップ関連のグラフを信用しない。
          expr: |
            min_over_time(pbs_observer_collection_success[15m]) == 0
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "PBS observer の収集が 30 分以上失敗しています"
            description: |
              どの取得元が落ちているかは pbs_observer_source_success で確認する。

    # -----------------------------------------------------------------------
    # バックアップの「結果」
    #
    # 既存の homelab.monitoring は「observer が動いているか」しか見ていない。
    # 収集は正常でも、バックアップ自体が失敗し続けることがある。
    #
    # 2026-09-11 から 5 夜連続で vzdump が
    #   No space left on device (os error 28)
    # で失敗していたが、誰も気づかなかった。そのとき
    #   pbs_observer_datastore_avail_bytes      = 0
    #   pbs_observer_latest_backup_task_success = 0
    #   pbs_observer_backup_tasks_failed_24h    = 1
    # はすべて収集済みだった。取れていた値に対してアラートが無かっただけ。
    # 経緯は docs/storage-migration-2026-09-13.md を参照。
    # -----------------------------------------------------------------------
    - name: homelab.backup
      rules:
        - alert: PBSDatastoreFull
          # 空きが尽きると prune すら書き込めず、削除もできなくなる。
          # 「容量が減ってきた」ではなく「詰んだ」状態なので critical。
          expr: |
            pbs_observer_datastore_avail_bytes
              / pbs_observer_datastore_total_bytes < 0.02
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "PBS データストア {{ $labels.datastore }} の空きが 2% 未満です"
            description: |
              この状態では新規バックアップも prune も失敗する。
              ext4 の root 予約ブロックがあるため、df の Available が 0 でも
              root にはまだ余地がある（PBS は backup ユーザーで動く）。
              確認: ssh root@172.16.10.51 'df -h /; tune2fs -l /dev/mapper/pbs-root | grep -i reserved'

        - alert: PBSDatastoreFillingUp
          # しきい値を 15% → 30% に上げた（2026-09-19）。
          #
          # 15% では猶予がゼロだったためである。実測では 09-17 00:30 に
          # 98.8 GiB（22%）あった空きが、1 回のバックアップで 06:30 に
          # 1.9 GiB（0.4%）になった。15% = 65 GiB は 1 晩ぶん（当時 97 GiB）に
          # 満たず、**このアラートが警告として機能する時間帯が存在しなかった。**
          # 発報はしたが、そのときには既に手遅れだった。
          #
          # 30% = 129 GiB。worker scsi0 を外したあとの 1 晩 49.9 GiB に対して
          # 約 2.6 晩ぶんにあたる。週末を挟んでも気づける幅を優先する。
          expr: |
            pbs_observer_datastore_avail_bytes
              / pbs_observer_datastore_total_bytes < 0.30
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "PBS データストア {{ $labels.datastore }} の空きが 30% 未満です"
            description: |
              保持ポリシーと GC の結果を確認する。
              確認: ssh root@172.16.10.51 'proxmox-backup-manager prune-job list'
              増加の原因を切り分ける: scripts/pbs-chunk-growth.py を PBS へ送って実行する

        - alert: PBSDatastoreWillFill
          # しきい値ではなく傾きで見る。
          #
          # PBS の使用量は「じわじわ増える」のではなく、02:30 のジョブで
          # 1 晩ぶんが階段状に乗る。静的なしきい値はこの形と相性が悪く、
          # 1 段で跨いでしまうと警告の意味を成さない（上の 15% がそれだった）。
          # 6 時間の傾きから 36 時間後を予測し、次の 1 晩が入らないと
          # 分かった時点で鳴らす。予防的に効かせたいので warning ではなく
          # critical にしている — 空になってからでは prune も動かないため。
          expr: |
            predict_linear(pbs_observer_datastore_avail_bytes[6h], 36 * 3600) < 0
          for: 30m
          labels:
            severity: critical
          annotations:
            summary: "PBS データストア {{ $labels.datastore }} は 36 時間以内に満杯になる見込みです"
            description: |
              今の増加ペースが続くと次回以降のバックアップが ENOSPC で失敗する。
              満杯になると prune も GC も書き込めず自己回復できないため、
              **空く前に手を打つこと。**
              対処の手順: docs/pbs-capacity-2026-09-19.md §対処

        - alert: PBSBackupTaskFailing
          # 直近の vzdump タスクが失敗した状態。日次ジョブなので
          # 6h 継続 = その日の実行が失敗したと確定してよい。
          expr: |
            pbs_observer_latest_backup_task_success == 0
          for: 6h
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.node }} の直近のバックアップタスクが失敗しています"
            description: |
              確認: ssh root@172.16.10.11 'grep -ah vzdump /var/log/pve/tasks/index | tail -5'
              失敗理由はタスクログ /var/log/pve/tasks/<n>/<UPID> を見る。

        - alert: PBSBackupStale
          # 静かに止まることが最も危ない。ジョブは毎日 02:30 なので、
          # 36h 更新が無ければ 1 回以上落ちている。
          #
          # VM 1200 は kubernetes-daily-pbs の対象外（vmid は 1001-1003,1101-1103）で
          # 定期バックアップが無いため除外する。1200 をジョブに追加したら
          # この除外も外すこと。
          expr: |
            time() - pbs_observer_latest_snapshot_timestamp_seconds{backup_id!="1200"}
              > 36 * 3600
          for: 30m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.backup_type }}/{{ $labels.backup_id }} のバックアップが 36 時間以上更新されていません"
            description: |
              バックアップジョブが失敗しているか、無効化されている。
              確認: ssh root@172.16.10.11 'cat /etc/pve/jobs.cfg'

        - alert: PBSBackupScheduleDisabled
          expr: |
            pbs_observer_schedule_enabled == 0
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "バックアップジョブ {{ $labels.job_id }} が無効化されています"
            description: |
              一時的に止めた場合は、戻し忘れていないか確認する。

        - alert: PBSGarbageCollectionFailing
          # GC が回らないと、prune しても実際の空き容量は戻らない。
          expr: |
            pbs_observer_gc_last_success == 0
          for: 2h
          labels:
            severity: warning
          annotations:
            summary: "PBS {{ $labels.datastore }} のガベージコレクションが失敗しています"
            description: |
              確認: ssh root@172.16.10.51 'proxmox-backup-manager garbage-collection status gateway-backup'
