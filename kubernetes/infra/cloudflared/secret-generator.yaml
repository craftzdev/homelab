# ===========================================================================
# KSOPS ジェネレータ
#
# ArgoCD の repo-server に組み込まれた ksops プラグインが、
# ここで指定された SOPS 暗号化ファイルを復号して Secret を生成する。
#
# 復号には age 秘密鍵が必要で、それは ArgoCD の repo-server に
# `sops-age` Secret としてマウントされている
# （kubernetes/bootstrap/argocd/ を参照）。
# ===========================================================================
apiVersion: viaduct.ai/v1
kind: ksops
metadata:
  name: cloudflared-secret-generator
  annotations:
    config.kubernetes.io/function: |
      exec:
        path: ksops
files:
  - credentials.sops.yaml
