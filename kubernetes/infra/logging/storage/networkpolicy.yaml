---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: logging
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]

---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: logging-dns-and-probes
  namespace: logging
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
  ingress:
    - fromEntities:
        - host
        - remote-node

---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: minio-access
  namespace: logging
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: minio
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: logging
            app.kubernetes.io/name: loki
        - matchLabels:
            io.kubernetes.pod.namespace: logging
            app.kubernetes.io/name: minio-bucket-bootstrap
        - matchLabels:
            io.kubernetes.pod.namespace: logging
            app.kubernetes.io/name: minio-umami-bootstrap
        - matchLabels:
            io.kubernetes.pod.namespace: analytics
        - matchLabels:
            io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports:
            - port: "9000"
              protocol: TCP

---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: minio-bootstrap-egress
  namespace: logging
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: minio-bucket-bootstrap
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: logging
            app.kubernetes.io/name: minio
      toPorts:
        - ports:
            - port: "9000"
              protocol: TCP

---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: minio-umami-bootstrap-egress
  namespace: logging
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: minio-umami-bootstrap
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: logging
            app.kubernetes.io/name: minio
      toPorts:
        - ports:
            - port: "9000"
              protocol: TCP

---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: loki-access
  namespace: logging
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: loki
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: logging
            app.kubernetes.io/name: minio
      toPorts:
        - ports:
            - port: "9000"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: logging
            app.kubernetes.io/name: loki
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: logging
        - matchLabels:
            io.kubernetes.pod.namespace: logging-audit
        - matchLabels:
            io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports:
            - port: "3100"
              protocol: TCP
            - port: "7946"
              protocol: TCP

---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: alloy-access
  namespace: logging
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: alloy
  egress:
    - toEntities:
        - kube-apiserver
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: logging
            app.kubernetes.io/name: loki
      toPorts:
        - ports:
            - port: "3100"
              protocol: TCP
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports:
            - port: "12345"
              protocol: TCP
