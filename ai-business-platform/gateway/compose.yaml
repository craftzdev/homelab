services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: gateway
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d gateway"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - backend

  public-api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      API_SURFACE: public
      COMFYUI_BASE_URL: ${COMFYUI_BASE_URL-https://omen45.tailb6c7d.ts.net:8443}
      VIDEO_DATA_DIR: /data/videos
      DATABASE_URL: postgresql://gateway:${POSTGRES_PASSWORD}@db:5432/gateway
      GATEWAY_API_TOKEN: ${GATEWAY_API_TOKEN}
      WORKER_CALLBACK_TOKEN: ${WORKER_CALLBACK_TOKEN}
      WORKER_BASE_URL: ${WORKER_BASE_URL}
      WORKER_API_TOKEN: ${WORKER_API_TOKEN}
      # The Worker this process delivers to, so its reports are recorded under
      # the same logical id as the standalone scheduler's.
      WORKER_LOGICAL_ID: ${WORKER_LOGICAL_ID:-ai-business-worker}
      HUMAN_APPROVAL_TOKEN: ${HUMAN_APPROVAL_TOKEN}
      HUMAN_APPROVAL_ACTOR: ${HUMAN_APPROVAL_ACTOR:-}
      CONFIG_ADMIN_TOKEN: ${CONFIG_ADMIN_TOKEN:-}
      CONFIG_ADMIN_ACTOR: ${CONFIG_ADMIN_ACTOR:-}
      CONFIG_CONTROLLER_TOKEN: ${CONFIG_CONTROLLER_TOKEN:-}
      CONTROLLER_API_TOKEN: ${CONTROLLER_API_TOKEN:-}
      CLOUDFLARE_ACCESS_REQUIRED: ${CLOUDFLARE_ACCESS_REQUIRED:-false}
      CLOUDFLARE_ACCESS_TEAM_DOMAIN: ${CLOUDFLARE_ACCESS_TEAM_DOMAIN:-}
      CLOUDFLARE_ACCESS_AUD: ${CLOUDFLARE_ACCESS_AUD:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 6
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - video-data:/data/videos
    networks:
      - frontend
      - backend

  # Durable dispatch. The API registers a Job and queues its delivery in one
  # commit; this process performs the delivery, so ending an API request cannot
  # lose an accepted Job. An advisory lock keeps one scheduler active.
  dispatch-scheduler:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "-m", "app.scheduler"]
    environment:
      DATABASE_URL: postgresql://gateway:${POSTGRES_PASSWORD}@db:5432/gateway
      WORKER_BASE_URL: ${WORKER_BASE_URL}
      WORKER_API_TOKEN: ${WORKER_API_TOKEN}
      # The Worker this scheduler delivers to and asks for its own status.
      WORKER_LOGICAL_ID: ${WORKER_LOGICAL_ID:-ai-business-worker}
    networks:
      - frontend
      - backend

  # The Workflow Controller's surface. Exposed on the Tailnet only, with its own
  # credential, so advancing work is never reachable through the public ingress.
  internal-api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      API_SURFACE: internal
      DATABASE_URL: postgresql://gateway:${POSTGRES_PASSWORD}@db:5432/gateway
      GATEWAY_API_TOKEN: ${GATEWAY_API_TOKEN}
      WORKER_CALLBACK_TOKEN: ${WORKER_CALLBACK_TOKEN}
      CONTROLLER_API_TOKEN: ${CONTROLLER_API_TOKEN}
      CLOUDFLARE_ACCESS_REQUIRED: "false"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 6
    ports:
      - "127.0.0.1:8082:8080"
    networks:
      - frontend
      - backend

  callback-api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      API_SURFACE: callback
      DATABASE_URL: postgresql://gateway:${POSTGRES_PASSWORD}@db:5432/gateway
      GATEWAY_API_TOKEN: ${GATEWAY_API_TOKEN}
      WORKER_CALLBACK_TOKEN: ${WORKER_CALLBACK_TOKEN}
      CLOUDFLARE_ACCESS_REQUIRED: "false"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 6
    ports:
      - "127.0.0.1:8081:8080"
    networks:
      - frontend
      - backend

networks:
  frontend:
  backend:
    internal: true

volumes:
  postgres-data:
  video-data:
