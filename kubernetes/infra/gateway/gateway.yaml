# ===========================================================================
# Gateway — 外部公開の入口
#
# cloudflared からのリクエストを受け、HTTPRoute の定義に従って
# 各アプリの Service へ振り分ける。ingress-nginx の役割を引き継ぐ。
#
# ---------------------------------------------------------------------------
# Ingress との違いと、それが嬉しい理由
# ---------------------------------------------------------------------------
# Ingress は「1 つのリソースにルーティングも TLS も annotation による
# 独自拡張も全部詰め込む」設計だった。誰が何を変更してよいかが曖昧で、
# annotation 経由の設定注入が脆弱性の温床にもなっていた
# （ingress-nginx の snippet annotation 関連の CVE 群）。
#
# Gateway API は役割を分離する:
#   - Gateway   … 基盤チームが管理。どのポートを開き、どの namespace から
#                  ルートを受け付けるかを決める（このファイル）
#   - HTTPRoute … アプリチームが管理。自分の namespace 内でパスと
#                  バックエンドを定義する
#
# 「Ingress を作れる権限」が「任意の内部サービスを公開できる権限」に
# なっていた問題が、構造的に解消される。
# ===========================================================================
---
apiVersion: v1
kind: Namespace
metadata:
  name: gateway
  labels:
    # Cilium の Envoy は cilium-agent の一部として動くため、
    # この namespace には Gateway リソースしか存在しない。
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted

    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: external-access

    # 下の default-404 HTTPRoute はこの namespace にあるため、Gateway の
    # allowedRoutes セレクタに一致していなければ受け付けられない。
    # このラベルが無いと catch-all が機能せず、未定義のホスト名に対して
    # Gateway の既定応答が露出する。
    homelab.io/gateway-access: external

---
# ===========================================================================
# ⚠️ LAN 側に第 2 の入口を作らせない
#
# Cilium の Gateway API は必ず Service を作る。type に選べるのは
# LoadBalancer か NodePort だけで、ClusterIP は指定できない
# （CiliumGatewayClassConfig の service.type がこの 2 つに限定されている）。
# 以前 Gateway に書かれていた `io.cilium/lb-mode: clusterip` という
# annotation は Cilium が読まないため、何の効果も無かった。
#
# LAN 側の入口は 2 つありうる。
#
#   1. LoadBalancer の外部 IP
#      → vlan40-pool の serviceSelector が
#        `homelab.io/lan-exposed: "true"` を要求しており、この Service には
#        付いていないため IP は割り当てられない。
#
#   2. NodePort
#      → 既定では割り当てられてしまう。全ノードの VLAN40 アドレスで
#        Gateway に到達でき、Cloudflare Access を迂回できる。
#        allocateLoadBalancerNodePorts: false がこれを塞ぐ。
#
# 結果として Service はクラスタ内の ClusterIP からしか到達できず、
# 「外部公開は Cloudflare Tunnel のみ」が構成として保証される。
#
# ⚠️ この設定を Gateway の spec.infrastructure.parametersRef から参照しては
#    ならない。Cilium はそれを明示的に拒否し、Gateway が Accepted=False に
#    なる。GatewayClass の spec.parametersRef だけが対応している。
#    Cilium 同梱の `cilium` GatewayClass は chart が管理していて書き換えても
#    戻されるため、専用の GatewayClass を下に定義して束ねる。
# ===========================================================================
apiVersion: cilium.io/v2alpha1
kind: CiliumGatewayClassConfig
metadata:
  name: external-no-nodeport
  namespace: gateway
  labels:
    app.kubernetes.io/part-of: external-access
spec:
  # CRD 側で 64 バイトまでに制限されている。詳細は上のコメントを参照。
  description: External gateway service; no NodePort.
  service:
    type: LoadBalancer
    allocateLoadBalancerNodePorts: false

---
# ===========================================================================
# 専用 GatewayClass
#
# controllerName は Cilium 同梱のものと同じで、担当するコントローラは
# 変わらない。違いは parametersRef を持てることだけである。
# ===========================================================================
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: cilium-external
  labels:
    app.kubernetes.io/part-of: external-access
spec:
  controllerName: io.cilium/gateway-controller
  description: Cilium gateway class with LAN NodePort allocation disabled.
  parametersRef:
    group: cilium.io
    kind: CiliumGatewayClassConfig
    name: external-no-nodeport
    namespace: gateway

---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: external
  namespace: gateway
  labels:
    app.kubernetes.io/part-of: external-access
spec:
  # Cilium 既定の `cilium` ではなく、NodePort を無効化する設定を
  # parametersRef で束ねた専用の GatewayClass を使う。理由は上記を参照。
  gatewayClassName: cilium-external


  listeners:
    # -------------------------------------------------------------------------
    # HTTP のみ。TLS 終端は Cloudflare エッジで行う。
    #
    # cloudflared → Gateway はクラスタ内部の通信であり、
    # Cilium の WireGuard でノード間は暗号化されている。
    # ここで TLS を終端すると証明書の管理が増えるだけで、
    # 守られる範囲は変わらない。
    # -------------------------------------------------------------------------
    # -------------------------------------------------------------------------
    # ⚠️ listener ごとに hostname を固定する
    #
    # hostname を書かない listener は「任意のホスト名を受け付ける」という
    # 意味になる。その状態では、下の allowedRoutes ラベルを持つ namespace の
    # 所有者が、自分のものではないホスト名を主張する HTTPRoute を作れる。
    # Gateway API はより具体的なパスを優先するため、既存の公開サービス宛の
    # トラフィックを横取りできてしまう。アプリ側のリポジトリは基盤より
    # レビューが緩いことが多く、そこが基盤の入口を左右してはならない。
    #
    # ホスト名は基盤側（このファイル）が決め、パスとバックエンドだけを
    # アプリ側の HTTPRoute に任せる。Gateway API が Ingress と分けている
    # 責務境界そのものである。
    #
    # ⚠️ 公開ホスト名を増やすときは、ここと tofu/20-cloudflare の
    #    public_services / published_services を同じ PR で更新する。
    #    listener が無いホスト名は Envoy に届いた時点で 404 になる。
    # -------------------------------------------------------------------------
    - name: moshitoku
      protocol: HTTP
      port: 80
      hostname: moshitoku.com

      # -----------------------------------------------------------------------
      # ⚠️ どの namespace から HTTPRoute を受け付けるかを制限する
      #
      # `from: All` にすると、任意の namespace の誰でも
      # 「この Gateway 経由で自分のサービスを公開する」ことができてしまう。
      # ラベルで明示的に許可した namespace だけに限定する。
      #
      # 公開したい namespace には次のラベルを付ける:
      #   kubectl label namespace <ns> homelab.io/gateway-access=external
      # -----------------------------------------------------------------------
      allowedRoutes: &external-routes
        namespaces:
          from: Selector
          selector:
            matchLabels:
              homelab.io/gateway-access: external
        kinds:
          - kind: HTTPRoute

    - name: moshitoku-www
      protocol: HTTP
      port: 80
      hostname: www.moshitoku.com
      allowedRoutes: *external-routes

---
# ===========================================================================
# 既定の応答（catch-all）
#
# どの HTTPRoute にも一致しないリクエストを cloudflare.com へ 302 で送る。
# これが無いと Gateway の既定応答が露出し、内部構成の手がかりを与えうる。
# 名前が default-404 なのは歴史的経緯で、実際に返すのは 404 ではなく 302 である。
# ===========================================================================
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: default-404
  namespace: gateway
  labels:
    app.kubernetes.io/part-of: external-access
spec:
  parentRefs:
    - name: external
      namespace: gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            # 意図しないホスト名でのアクセスに情報を返さない
            statusCode: 302
            hostname: cloudflare.com
