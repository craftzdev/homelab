# ===========================================================================
# 各 namespace の default-deny
#
# ---------------------------------------------------------------------------
# なぜテンプレートではなく実体が必要なのか
# ---------------------------------------------------------------------------
# 当初は default-deny-template.yaml を「コピーして使う雛形」として置いていたが、
# codex のレビューで次を指摘された。
#
#   [HIGH]「全namespace default-deny」は実装されていない
#     policyEnforcementMode: default なので、ポリシー未選択の Endpoint は
#     許可状態になる。default-deny テンプレートは Kustomization から
#     除外されており、argocd / cert-manager / default 等に
#     完全な default-deny が存在しない。
#     → 設計文書の「外部通信は限定コンポーネントのみ」と一致しない。
#
# 指摘の通りだった。**雛形を置いただけでは何も守られていない。**
# ここで実体を定義する。
#
# ---------------------------------------------------------------------------
# なぜ policyEnforcementMode: always にしないのか
# ---------------------------------------------------------------------------
# `always` にすればクラスタ全体が自動的に default-deny になる。しかし
#
#   - ポリシーの書き漏れが即座にクラスタ全体の停止につながる
#   - bootstrap 中（Cilium 自身がまだ起動していない段階）に
#     CoreDNS や apiserver への通信が落ちて詰む
#   - 「どの namespace が保護されているか」がマニフェストから読めなくなる
#
# namespace ごとに明示的な default-deny を置く方式なら、
# 保護の有無が Git 上で一目で分かり、段階的に適用範囲を広げられる。
#
# ---------------------------------------------------------------------------
# ⚠️ 新しい namespace を作ったら、ここに追加すること
# ---------------------------------------------------------------------------
# 追加を忘れると、その namespace は「何でも通る」状態のままになる。
# CI で検出する仕組みは無いため、レビューで確認する。
# ===========================================================================

---
# ---------------------------------------------------------------------------
# argocd
#
# ⚠️ ArgoCD はクラスタに何でもデプロイできる権限を持つ。侵害された場合の
#    影響が最も大きい namespace の 1 つであり、default-deny の価値が高い。
# ---------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: argocd
  annotations:
    # Argo CD must receive its explicit API/DNS/repository allows before its
    # blanket deny becomes active, otherwise the first GitOps sync can cut the
    # controller off halfway through its own Application.
    argocd.argoproj.io/sync-wave: "1"
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]

---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: argocd-rules
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  endpointSelector: {}

  egress:
    # --- DNS ---
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP

    # --- kube-apiserver（同期対象の適用に必須）---
    - toEntities:
        - kube-apiserver

    # --- argocd namespace 内（server / repo-server / controller / redis 間）---
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: argocd

    # -----------------------------------------------------------------------
    # --- Git リポジトリと Helm chart リポジトリ（HTTPS）---
    #
    # repo-server が GitHub や各 chart リポジトリからマニフェストを取得する。
    # 宅内ネットワークへは出さない（クラスタワイドの egressDeny でも
    # 二重に塞いでいる）。
    # -----------------------------------------------------------------------
    - toCIDRSet:
        - cidr: 0.0.0.0/0
          except:
            - 172.16.0.0/12
            - 10.0.0.0/8
            - 192.168.0.0/16
            - 100.64.0.0/10
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            # アプリ側リポジトリ（ai-business-* / moshitoku*）は
            # git@github.com の SSH URL で取得している。以前はクラスタワイドの
            # `toEntities: all` がこの穴を隠していた。
            - port: "22"
              protocol: TCP

  ingress:
    # --- argocd namespace 内 ---
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: argocd

    # --- 運用者の port-forward（apiserver 経由で来る）---
    - fromEntities:
        - kube-apiserver

    # --- kubelet の probe / メトリクス取得 ---
    - fromEntities:
        - host
        - remote-node
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: monitoring

---
# The standalone Tailscale Ingress proxy runs in the tailscale namespace.
# Permit it to reach only the Argo CD server's cleartext in-cluster listener;
# Tailnet HTTPS is terminated by the proxy before this hop.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: argocd-tailnet-ingress
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: argocd-server
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: tailscale
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP

---
# ---------------------------------------------------------------------------
# cert-manager
# ---------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: cert-manager
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]

---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cert-manager-rules
  namespace: cert-manager
spec:
  endpointSelector: {}

  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP

    - toEntities:
        - kube-apiserver

    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: cert-manager

    # ACME（Let's Encrypt）や DNS-01 チャレンジ用の外部通信。
    # 現状 ACME は使っていないが、将来有効化したときに
    # 「なぜか証明書が取れない」で悩まないよう許可しておく。
    - toCIDRSet:
        - cidr: 0.0.0.0/0
          except:
            - 172.16.0.0/12
            - 10.0.0.0/8
            - 192.168.0.0/16
            - 100.64.0.0/10
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP

  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: cert-manager
    # webhook は apiserver から呼ばれる
    - fromEntities:
        - kube-apiserver
    - fromEntities:
        - host
        - remote-node
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: monitoring

---
# ---------------------------------------------------------------------------
# default namespace
#
# ⚠️ ここに一般のワークロードを置かない運用だが、「気づいたら何か動いていた」
#    ときに無防備にならないよう default-deny を敷いておく。
#    アプリを置く場合は専用 namespace を作ること。
# ---------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: default
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]

---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-baseline
  namespace: default
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
  ingress:
    - fromEntities:
        - host
        - remote-node

---
# ---------------------------------------------------------------------------
# monitoring
#
# Prometheus は「クラスタ中の Pod を片っ端から scrape する」のが仕事なので、
# 宛先を絞る意味は薄い。ここで閉じたいのはその逆で、インターネットへの
# 外向き通信である（侵害時の持ち出し経路になる）。
#
# 宅内 CIDR への deny は clusterwide-egress-deny.yaml が担う。VLAN40 の
# node-exporter（Talos ノードと Business Gateway VM）は宅内 CIDR ではないため、
# ここで明示する。
# ---------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: monitoring
spec:
  podSelector: {}
  policyTypes: [Egress]

---
# monitoring 内の全 Pod に共通の最小限。scrape の広い許可は Prometheus だけに
# 与える（下）。Grafana / Alertmanager / Operator / kube-state-metrics が
# 侵害されても、クラスタ中の Pod やノードを探れないようにする。
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: monitoring-egress
  namespace: monitoring
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP

    # Operator / kube-state-metrics / Grafana / Prometheus いずれも参照する。
    - toEntities:
        - kube-apiserver

    # monitoring namespace 内（Prometheus ↔ Alertmanager ↔ Grafana、
    # Alertmanager のクラスタ間通信）。
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: monitoring

---
# Prometheus だけがクラスタ全体を scrape する。
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: prometheus-scrape
  namespace: monitoring
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  egress:
    # クラスタ内の scrape 先。exporter ごとにポートが異なり、追加のたびに
    # 変わるため宛先ポートは絞らない。
    - toEndpoints:
        - {}

    # kubelet（10250）と node-exporter（9100）。ノード上で動くため Pod では
    # なく host / remote-node として現れる。ポートを絞り、ノード上の他の
    # サービスへは出られないようにする。
    - toEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "10250"
              protocol: TCP
            - port: "9100"
              protocol: TCP

    # VLAN40 上の node-exporter（Talos ノードと Business Gateway VM）。
    # 宅内 CIDR ではないため clusterwide の deny では塞がれない。
    - toCIDR:
        - 172.16.40.0/24
      toPorts:
        - ports:
            - port: "9100"
              protocol: TCP

---
# Grafana はプラグイン一覧とバージョン確認で grafana.com を参照する。
# 公開 IP 全体ではなく FQDN で絞る（toFQDNs は DNS プロキシが名前解決を
# 観測できることが前提なので、DNS ルールを同じ Pod に付ける）。
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: grafana-public-https
  namespace: monitoring
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    - toFQDNs:
        - matchName: grafana.com
        - matchPattern: "*.grafana.com"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP

---
# ---------------------------------------------------------------------------
# image-registry
#
# レジストリは pull を受けるだけで、外へ出る必要が無い。
# ---------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: image-registry
spec:
  podSelector: {}
  policyTypes: [Egress]

---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: image-registry-egress
  namespace: image-registry
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP

---
# ---------------------------------------------------------------------------
# kubelet-serving-cert-approver
#
# kubelet の CSR を承認するだけのコンポーネント。apiserver 以外へは出ない。
# ---------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: kubelet-serving-cert-approver
spec:
  podSelector: {}
  policyTypes: [Egress]

---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: kubelet-serving-cert-approver-egress
  namespace: kubelet-serving-cert-approver
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEntities:
        - kube-apiserver
