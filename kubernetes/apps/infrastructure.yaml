---
# ---------------------------------------------------------------------------
# Cilium Gateway API — 外部公開の入口
#
# Gateway 本体は cilium-agent 内の Envoy として動くため、この Application が
# 作るのは namespace と Gateway / HTTPRoute リソースだけである。
#
# Service は type: LoadBalancer のままだが、LAN からは到達できない。
# NodePort は CiliumGatewayClassConfig で無効化し、LB IPAM の serviceSelector
# にも一致させていないため外部 IP も付かない。詳細は
# kubernetes/infra/gateway/gateway.yaml のコメントを参照。
#
# HTTPRoute を受け付ける namespace は `homelab.io/gateway-access: external`
# ラベルで明示的に絞る。これが無いと、namespace を作れる者が誰でも
# 任意の内部サービスをインターネットへ公開できてしまう。
# ---------------------------------------------------------------------------
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    # Gateway API の CRD は parentRefs の group/kind などを API サーバー側で
    # 既定値補完する。ServerSideApply との組み合わせでは、その補完分が
    # 差分として残り続けて永久に OutOfSync になる。API サーバーの
    # dry-run 結果と比較させて、desired/live の判定を実態に合わせる。
    argocd.argoproj.io/compare-options: ServerSideDiff=true
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infrastructure
  source:
    repoURL: https://github.com/craftzdev/homelab.git
    targetRevision: main
    path: kubernetes/infra/gateway
  destination:
    server: https://kubernetes.default.svc
    namespace: gateway
  syncPolicy:
    automated:
      # 公開中のルートを prune で消すと外部から全断する。削除は手動で行う。
      prune: false
      selfHeal: true
    syncOptions:
      # namespace は gateway.yaml が Pod Security ラベル付きで作る。
      - CreateNamespace=false
      - ServerSideApply=true

---
# ---------------------------------------------------------------------------
# cloudflared — Cloudflare Tunnel の接続元
#
# 自宅にインバウンドのポートを開けずに moshitoku.com を公開するための出口。
# Pod から Cloudflare エッジへ outbound の接続を張り、その上に受信を載せる。
#
# config.yaml（ingress ルール）と credentials.json は tofu/20-cloudflare が
# 生成する。ingress ConfigMap は generated/ 配下のコミット済みファイル、
# 認証情報は KSOPS が復号する credentials.sops.yaml である。どちらも
# 手で編集しない。変更は tofu 側の public_services / published_services を
# 直して apply する。
#
# ⚠️ cloudflared は config.yaml のホットリロードに対応しない。ingress を
#    変更したら Deployment を再起動する必要がある。
# ---------------------------------------------------------------------------
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudflared
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infrastructure
  source:
    repoURL: https://github.com/craftzdev/homelab.git
    targetRevision: main
    # KSOPS を動かすため kustomization.yaml をそのまま使う。
    # directory.include を指定すると kustomize として扱われなくなる。
    path: kubernetes/infra/cloudflared
  destination:
    server: https://kubernetes.default.svc
    namespace: cloudflared
  syncPolicy:
    automated:
      # Tunnel を prune で落とすと公開経路が全断する。削除は手動で行う。
      prune: false
      selfHeal: true
    syncOptions:
      # namespace は namespace.yaml が Pod Security ラベル付きで作る。
      - CreateNamespace=false
      - ServerSideApply=true
