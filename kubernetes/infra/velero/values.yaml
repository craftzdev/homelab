# ===========================================================================
# Velero — Kubernetes リソースと PVC のバックアップ
#
# ⚠️⚠️ 最重要の設計判断: バックアップ先はクラスタ外に置くこと
#
# 旧構成ではクラスタ内の MinIO をバックアップ先にしていたが、
# その MinIO の PVC も Ceph 上にある。つまり
#
#     Ceph が壊れたら、バックアップも一緒に消える。
#
# これは「バックアップ」の定義を満たしていない。
# 誤削除（S3）からは復旧できるが、ストレージ層の障害（S5）や
# ランサムウェア（S6）には無力である。
#
# 本構成では Cloudflare R2（egress 無料・S3 互換）を既定の
# バックアップ先とする。詳細は docs/adr/0008-backup-strategy.md を参照。
# ===========================================================================

# ---------------------------------------------------------------------------
# 認証情報
#
# SOPS で暗号化した Secret（velero-credentials）から読み込む。
# scripts/ 経由ではなく手動で作成する（README.md 参照）。
# ---------------------------------------------------------------------------
credentials:
  useSecret: true
  existingSecret: velero-credentials

configuration:
  # -------------------------------------------------------------------------
  # バックアップ保存先
  #
  # ⚠️ bucket / s3Url は環境に合わせて必ず変更すること。
  #    未設定のままだと Velero は起動するがバックアップに失敗する。
  # -------------------------------------------------------------------------
  backupStorageLocation:
    - name: default
      provider: aws
      bucket: REPLACE_ME_BUCKET
      default: true
      config:
        region: auto
        # Cloudflare R2 の例:
        #   https://<account-id>.r2.cloudflarestorage.com
        s3Url: https://REPLACE_ME.r2.cloudflarestorage.com
        s3ForcePathStyle: "true"
        # チェックサムアルゴリズムを無効化する（R2 は一部未対応）
        checksumAlgorithm: ""

  # -------------------------------------------------------------------------
  # ボリュームスナップショット
  #
  # ceph-csi の VolumeSnapshot を使う。CSI スナップショットは
  # Ceph 内に作られるため、これ単体では Ceph 障害に耐えられない。
  # そのため下の fileSystemBackup（データを実際にオブジェクトストレージへ
  # 転送する方式）を併用する。
  # -------------------------------------------------------------------------
  volumeSnapshotLocation:
    - name: default
      provider: csi

  features: EnableCSI

  defaultVolumesToFsBackup: true

  # バックアップの既定保持期間
  defaultBackupTTL: 720h # 30 日

  logLevel: info

# ---------------------------------------------------------------------------
# プラグイン
# ---------------------------------------------------------------------------
initContainers:
  - name: velero-plugin-for-aws
    image: velero/velero-plugin-for-aws:v1.13.0
    volumeMounts:
      - mountPath: /target
        name: plugins
  - name: velero-plugin-for-csi
    image: velero/velero-plugin-for-csi:v0.7.1
    volumeMounts:
      - mountPath: /target
        name: plugins

# ---------------------------------------------------------------------------
# node-agent（旧 restic）
#
# PVC の中身をファイル単位でオブジェクトストレージへ転送する。
# CSI スナップショットと違い、Ceph の外へデータが出るため
# Ceph 全損からも復旧できる。
# ---------------------------------------------------------------------------
deployNodeAgent: true

nodeAgent:
  podVolumePath: /var/lib/kubelet/pods
  privileged: false
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 512Mi

metrics:
  enabled: true
  serviceMonitor:
    enabled: true
    additionalLabels:
      release: kube-prometheus-stack

# スケジュールは schedules.yaml で管理する（Helm ではなくマニフェストで
# 定義することで、変更内容が Git の差分として読みやすくなる）
schedules: {}

upgradeCRDs: true
cleanUpCRDs: false
