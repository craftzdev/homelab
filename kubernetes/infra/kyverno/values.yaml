# ===========================================================================
# Kyverno — イメージ署名の検証（まずは audit のみ）
#
# ---------------------------------------------------------------------------
# 何をするのか
# ---------------------------------------------------------------------------
# Harbor から取得するアプリのイメージに、アプリ側 CI（GitHub Actions）の
# keyless 署名が付いているかを admission で検証する。
#
# 最初は ClusterPolicy 側を Audit にしてあり、**何も拒否しない**。
# PolicyReport に結果だけが残る。全イメージが署名付きに入れ替わったのを
# 確認してから Enforce へ切り替える。
#
# ---------------------------------------------------------------------------
# 署名の取得と TLS
# ---------------------------------------------------------------------------
# 署名はイメージと同じ Harbor（172.16.40.201:5000）から HTTPS で取る。その
# 証明書は自前 CA で、Kyverno のコンテナはそれを知らない。
#
# caCertificates はコンテナの ca-certificates.crt を **丸ごと置き換える**
# ため、自前 CA だけを入れると Sigstore（Fulcio / Rekor / TUF）への TLS が
# 検証できなくなる。そこで「公開 CA ＋ 自前 CA」を束ねた ConfigMap を
# 渡している。中身は scripts/reconcile-kyverno-ca-bundle.sh が作る。
#
# ⚠️ allowInsecureRegistry は使わない。あれは TLS 検証の省略ではなく平文
#    HTTP への切り替えで、Harbor は HTTPS しか受けないため 400 になる。
#
# 資格情報の Secret も kyverno namespace に置く。既存の読み取り専用ロボットから
# scripts/reconcile-kyverno-registry-credentials.sh が作る。
# ===========================================================================

# ⚠️ caCertificates.volume は使わない。chart はそれを subPath なしで
#    /etc/ssl/certs/ca-certificates.crt（ファイル）へマウントするため、
#    ConfigMap（ディレクトリ）を渡すとコンテナが起動できない
#    （"not a directory"）。代わりに普通のディレクトリとしてマウントし、
#    SSL_CERT_FILE でそのファイルを指す。
global:
  extraEnvVars:
    - name: SSL_CERT_FILE
      value: /etc/kyverno/ca/ca-certificates.crt

config:
  # 除外しておかないと、Kyverno 自身や Cilium の再起動が policy 評価に
  # 依存してしまい、障害時に復旧できなくなる。
  webhooks:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - kube-system
            - kyverno

admissionController:
  extraVolumes:
    - name: ca-bundle
      configMap:
        name: ca-bundle
  extraVolumeMounts:
    - name: ca-bundle
      mountPath: /etc/kyverno/ca
      readOnly: true
  replicas: 2
  nodeSelector:
    homelab.craftz.dev/workload-plane: "true"
  # ⚠️ 障害時に Pod が作れなくなる事態を避ける。Kyverno が落ちている間は
  #    検証をせずに通す（Ignore）。Enforce へ移行しても、可用性より
  #    「壊れたときにクラスタが止まらない」ことを優先する。
  #    ここを Fail にするなら、Kyverno の冗長性を先に確認すること。
  failurePolicy: Ignore
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  serviceMonitor:
    enabled: true

backgroundController:
  extraVolumes:
    - name: ca-bundle
      configMap:
        name: ca-bundle
  extraVolumeMounts:
    - name: ca-bundle
      mountPath: /etc/kyverno/ca
      readOnly: true
  nodeSelector:
    homelab.craftz.dev/workload-plane: "true"
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 384Mi
  serviceMonitor:
    enabled: true

reportsController:
  extraVolumes:
    - name: ca-bundle
      configMap:
        name: ca-bundle
  extraVolumeMounts:
    - name: ca-bundle
      mountPath: /etc/kyverno/ca
      readOnly: true
  nodeSelector:
    homelab.craftz.dev/workload-plane: "true"
  resources:
    requests:
      cpu: 50m
      memory: 192Mi
    limits:
      memory: 512Mi
  serviceMonitor:
    enabled: true

cleanupController:
  extraVolumes:
    - name: ca-bundle
      configMap:
        name: ca-bundle
  extraVolumeMounts:
    - name: ca-bundle
      mountPath: /etc/kyverno/ca
      readOnly: true
  nodeSelector:
    homelab.craftz.dev/workload-plane: "true"
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 192Mi
  serviceMonitor:
    enabled: true
