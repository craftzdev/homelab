---
apiVersion: v1
kind: Namespace
metadata:
  name: longhorn-system
  labels:
    # -------------------------------------------------------------------------
    # Pod Security Admission = privileged
    #
    # ⚠️ クラスタ既定は restricted であり、ここは意図的な例外である。
    #
    # Longhorn は以下を必要とする（CSI ドライバとして本質的な要件）:
    #   - privileged コンテナ（iSCSI デバイスのアタッチ、ブロックデバイス操作）
    #   - hostPID / hostNetwork（iscsid との連携）
    #   - mountPropagation: Bidirectional（kubelet へのマウント伝播）
    #   - ホストの /dev, /proc, /var/mnt/longhorn のマウント
    #
    # 代わりに以下で影響を限定する:
    #   1. この namespace に一般のワークロードを置かない
    #   2. Longhorn UI を外部公開しない（port-forward のみ）
    #   3. CiliumNetworkPolicy で通信先を限定する
    # -------------------------------------------------------------------------
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: latest
    # audit / warn は baseline にして、想定外の逸脱を検知できるようにする
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline

    app.kubernetes.io/name: longhorn
    app.kubernetes.io/part-of: storage

---
# ===========================================================================
# StorageClass
#
# Longhorn の Helm chart も `longhorn` という既定クラスを作るが、
# 用途別のクラスはここで明示的に定義する。
# 「どういう性質のストレージが使えるか」がマニフェストから読めるようにするため。
# ===========================================================================
---
# ---------------------------------------------------------------------------
# longhorn-retain — PVC を消しても PV とデータを残す
#
# データベースなど「消えては困る」ものに使う。
# PVC の削除でボリュームが即座に消えないため、誤操作からの復旧余地がある。
# （不要になった PV は手動で削除すること。放置すると容量を食い続ける）
# ---------------------------------------------------------------------------
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-retain
  labels:
    app.kubernetes.io/part-of: storage
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Retain
volumeBindingMode: Immediate
parameters:
  numberOfReplicas: "3"
  staleReplicaTimeout: "30"
  fsType: ext4
  # スナップショットからの復元時にデータの整合性を保つ
  dataLocality: disabled

---
# ---------------------------------------------------------------------------
# longhorn-single — レプリカ 1（冗長性なし）
#
# キャッシュや再生成可能なデータ用。3 レプリカは容量を 3 倍消費するため、
# 「失っても作り直せるもの」にまで冗長性を持たせるのは無駄である。
#
# ⚠️ ノード障害でデータが失われる。用途を選ぶこと。
# ---------------------------------------------------------------------------
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-single
  labels:
    app.kubernetes.io/part-of: storage
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Delete
volumeBindingMode: Immediate
parameters:
  numberOfReplicas: "1"
  staleReplicaTimeout: "30"
  fsType: ext4
  # レプリカが 1 つなら、Pod と同じノードに置いた方が速い
  dataLocality: best-effort

---
# ===========================================================================
# VolumeSnapshotClass
#
# Velero の CSI スナップショット連携で使う。
# ===========================================================================
apiVersion: snapshot.storage.k8s.io/v1
kind: VolumeSnapshotClass
metadata:
  name: longhorn-snapshot
  annotations:
    snapshot.storage.kubernetes.io/is-default-class: "true"
  labels:
    velero.io/csi-volumesnapshot-class: "true"
driver: driver.longhorn.io
deletionPolicy: Delete
parameters:
  # ---------------------------------------------------------------------------
  # type: bak → Longhorn の **バックアップ**（外部オブジェクトストレージへ転送）
  # type: snap → Longhorn の **スナップショット**（同じディスク上に残るだけ）
  #
  # ⚠️ `snap` は同一ディスク上にしか存在しないため、ディスクやノードが
  #    壊れれば一緒に失われる。災害復旧の役には立たない。
  #    バックアップ先を設定した上で `bak` を使うこと。
  #    設定するまでは Velero の CSI スナップショットは
  #    「誤削除からの復旧」用途に限られる。
  # ---------------------------------------------------------------------------
  type: bak
