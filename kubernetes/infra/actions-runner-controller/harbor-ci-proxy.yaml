apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: harbor-ci-selfsigned
  namespace: arc-runners
spec:
  selfSigned: {}

---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: harbor-ci-proxy
  namespace: arc-runners
spec:
  secretName: harbor-ci-proxy-tls
  commonName: 172.16.40.201
  ipAddresses:
    - 172.16.40.201
  isCA: true
  usages:
    - server auth
    - digital signature
    - key encipherment
    - cert sign
  issuerRef:
    name: harbor-ci-selfsigned
    kind: Issuer
  duration: 8760h
  renewBefore: 720h

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: harbor-ci-proxy
  namespace: arc-runners
data:
  default.conf: |
    map $upstream_http_www_authenticate $registry_authenticate {
      default $upstream_http_www_authenticate;
      ~^Bearer\ realm="https://harbor\.tailb6c7d\.ts\.net(?<auth_suffix>.*)$ "Bearer realm=\"https://172.16.40.201:5000${auth_suffix}";
    }

    server {
      listen 5000 ssl;
      server_name 172.16.40.201;

      ssl_certificate /etc/nginx/tls/tls.crt;
      ssl_certificate_key /etc/nginx/tls/tls.key;
      ssl_protocols TLSv1.2 TLSv1.3;

      client_max_body_size 0;
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_connect_timeout 30s;
      proxy_read_timeout 900s;
      proxy_send_timeout 900s;

      location / {
        proxy_pass http://harbor.harbor.svc.cluster.local:80;
        proxy_redirect https://harbor.tailb6c7d.ts.net/ https://172.16.40.201:5000/;
        proxy_set_header Host harbor.tailb6c7d.ts.net;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_hide_header WWW-Authenticate;
        add_header WWW-Authenticate $registry_authenticate always;
      }
    }

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: harbor-ci-proxy
  namespace: arc-runners
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: harbor-ci-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: harbor-ci-proxy
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        homelab.craftz.dev/workload-plane: "true"
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: >-
            nginxinc/nginx-unprivileged:1.31.5-alpine3.24@sha256:2ddec616f1cb58bcac057aa388f28cb81e35137641ef4226d321714499329bd1
          ports:
            - name: registry
              containerPort: 5000
          readinessProbe:
            httpGet:
              scheme: HTTPS
              path: /api/v2.0/ping
              port: registry
          livenessProbe:
            httpGet:
              scheme: HTTPS
              path: /api/v2.0/ping
              port: registry
            initialDelaySeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: tls
              mountPath: /etc/nginx/tls
              readOnly: true
            - name: cache
              mountPath: /var/cache/nginx
            - name: pid
              mountPath: /var/run
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: harbor-ci-proxy
        - name: tls
          secret:
            secretName: harbor-ci-proxy-tls
        - name: cache
          emptyDir: {}
        - name: pid
          emptyDir: {}
        - name: tmp
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: harbor-ci-proxy
  namespace: arc-runners
  labels:
    homelab.io/lan-exposed: "true"
  annotations:
    io.cilium/lb-ipam-ips: 172.16.40.201
spec:
  type: LoadBalancer
  loadBalancerIP: 172.16.40.201
  externalTrafficPolicy: Cluster
  selector:
    app.kubernetes.io/name: harbor-ci-proxy
  ports:
    - name: registry
      port: 5000
      targetPort: registry
      protocol: TCP
