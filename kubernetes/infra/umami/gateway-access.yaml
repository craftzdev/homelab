# ===========================================================================
# moshitoku からの計測受け入れ
#
# moshitoku.com は Umami の管理画面を公開せずに計測したい。そのため
# moshitoku の HTTPRoute が、計測に必要な 2 つのパスだけを
# この namespace の umami Service へ転送する。
#
#   https://moshitoku.com/_analytics/script.js → umami:3000 /script.js
#     Gateway が直接 Umami へ振り分ける。
#
#   https://moshitoku.com/_analytics/api/send  → moshitoku-analytics:8000
#     こちらは Gateway から Umami へ直接は行かない。moshitoku 側のアプリが
#     本文サイズ・レート・website ID を検証してから Umami へ転送する
#     （moshitoku の app/presentation/views/analytics.py）。
#     そのため **pod 間（moshitoku → analytics）の ingress** も要る。
#     下の umami-app-forward-ingress がそれを開ける。
#
# Umami 自身の公開範囲は変わらない。管理画面は引き続き Tailnet 限定である。
# ===========================================================================
---
# ---------------------------------------------------------------------------
# ReferenceGrant
#
# Gateway API では、別 namespace の Service を backendRef にする場合、
# **参照される側**が明示的に許可する必要がある。これが無いと
# HTTPRoute は ResolvedRefs: False となり、該当ルートだけが 500 を返す。
#
# 許可の範囲を moshitoku namespace の HTTPRoute からの Service 参照に
# 限定している。to に name を指定して umami Service だけを対象にする。
# ---------------------------------------------------------------------------
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: moshitoku-to-umami
  namespace: analytics
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: moshitoku
  to:
    - group: ""
      kind: Service
      name: umami

---
# ---------------------------------------------------------------------------
# Gateway からの ingress を許可する
#
# Cilium の Gateway API では、Envoy からバックエンドへの通信は
# 予約 identity "ingress" として現れる。analytics-rules は
# この identity を許可していないため、追加で開ける。
#
# Cilium のポリシーは許可の和集合で評価されるため、
# 既存の analytics-rules を書き換えずに追加できる。
# ---------------------------------------------------------------------------
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: umami-gateway-ingress
  namespace: analytics
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: umami
  ingress:
    - fromEntities: [ingress]
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP

---
# ---------------------------------------------------------------------------
# moshitoku のアプリからの転送を受ける
#
# /_analytics/api/send は Gateway から直接 Umami へは行かない。
# moshitoku-analytics が検証したうえでサーバー側から転送する。
# これは pod 間の通信なので "ingress" identity では表現されず、
# 上の umami-gateway-ingress では通らない。
#
# 2026-09-16 時点で、送信側（moshitoku-analytics の egress）には
# analytics/umami:3000 への許可が既にあったが、**受け側が無かった**。
# そのため moshitoku-analytics から umami へは到達できていなかった。
# 実際 pod からの疎通はタイムアウトしていた。
#
# ⚠️ 許可するのは moshitoku namespace から umami の 3000 のみ。
#    analytics-rules は書き換えない（Cilium は許可の和集合で評価する）。
# ---------------------------------------------------------------------------
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: umami-app-forward-ingress
  namespace: analytics
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: umami
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: moshitoku
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
