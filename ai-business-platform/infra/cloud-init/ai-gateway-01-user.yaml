#cloud-config
hostname: ai-gateway-01
manage_etc_hosts: true
timezone: Asia/Tokyo
package_update: true
package_upgrade: true
packages:
  - ca-certificates
  - curl
  - docker.io
  - docker-compose-v2
  - jq
  - qemu-guest-agent
  - ufw
  - unattended-upgrades
write_files:
  - path: /etc/sysctl.d/99-ai-gateway.conf
    permissions: "0644"
    content: |
      net.ipv4.conf.all.accept_redirects = 0
      net.ipv4.conf.default.accept_redirects = 0
      net.ipv4.conf.all.send_redirects = 0
      net.ipv4.conf.default.send_redirects = 0
runcmd:
  - [systemctl, enable, --now, qemu-guest-agent]
  - [systemctl, enable, --now, docker]
  - [usermod, -aG, docker, craftz]
  - [ufw, default, deny, incoming]
  - [ufw, default, allow, outgoing]
  - [ufw, allow, from, 172.16.10.0/24, to, any, port, "22", proto, tcp]
  - [ufw, allow, in, on, tailscale0]
  - [ufw, allow, 41641/udp]
  - [ufw, allow, out, to, 172.16.40.1, port, "53", proto, udp]
  - [ufw, allow, out, to, 172.16.40.1, port, "53", proto, tcp]
  - [ufw, deny, out, to, 172.16.10.0/24]
  - [ufw, deny, out, to, 172.16.20.0/24]
  - [ufw, deny, out, to, 172.16.30.0/24]
  - [ufw, deny, out, to, 172.16.40.0/24]
  - [ufw, --force, enable]
  - [sysctl, --system]
final_message: "ai-gateway-01 cloud-init complete"
