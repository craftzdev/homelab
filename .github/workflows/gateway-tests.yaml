name: gateway approval tests

on:
  push:
    branches: [main]
    paths:
      - ai-business-platform/gateway/**
      - .github/workflows/gateway-tests.yaml
  pull_request:
    paths:
      - ai-business-platform/gateway/**
      - .github/workflows/gateway-tests.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gateway-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  approvals:
    # The current homelab-runner has no Docker daemon. Run only for Gateway
    # changes; this isolated hosted job needs no homelab credentials/network.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: gateway_test
          POSTGRES_USER: gateway_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gateway_test -d gateway_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: ai-business-platform/gateway
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ai-business-platform/gateway/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q -p no:cacheprovider tests
        env:
          TEST_DATABASE_URL: postgresql://gateway_test@127.0.0.1:5432/gateway_test
