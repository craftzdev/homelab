# ===========================================================================
# 基盤コンポーネントの Application 定義
#
# ---------------------------------------------------------------------------
# 同期順序（sync-wave）
# ---------------------------------------------------------------------------
#   -20  policies        : クラスタ全体のネットワークポリシー
#   -10  cilium          : CNI。これが無いと他の Pod が起動しない
#   -15  gateway-api-crds : Gateway API の CRD（Cilium より先に必要）
#    -5  snapshot-controller : VolumeSnapshot の CRD
#     0  longhorn        : 分散ブロックストレージ（PV の供給元）
#     1  tailscale       : Tailnet ingress / egress
#     2  cert-manager    : 証明書管理（他が依存する）
#     4  cloudnative-pg : PostgreSQL operator
#     5  barman         : CloudNativePG backup plugin
#     5  monitoring      : 監視
#     5  logging-storage : MinIO（Loki のオブジェクトストレージ）
#     6  logging         : Loki / Alloy
#     6  logging-audit   : control-plane の Kubernetes 監査ログ収集
#     6  security        : Trivy / kubelet 証明書承認
#     7  arc-controller  : GitHub Actions Runner Controller
#     7  homepage        : Tailnet-only management portal
#     8  arc-runners     : ephemeral runner scale set
#     6  umami           : Tailnet-only analytics with HA PostgreSQL
#     3  gateway         : Cilium Gateway API の外部公開入口
#     4  cloudflared     : Cloudflare Tunnel の接続元（moshitoku.com）
#     7  gatus           : Cloudflare 公開経路の外形監視
#
# Tunnel は 2 系統ある。gateway.craftz.dev は Business Gateway VM 1200 上の
# 専用 Tunnel が終端し、クラスタを経由しない。moshitoku.com はクラスタ内の
# cloudflared Pod が張る Tunnel を通り、Cilium の Gateway API へ入る。
# Velero は外部オブジェクトストレージ設定後に別変更として有効化する。
#
# ---------------------------------------------------------------------------
# バージョンの固定について
# ---------------------------------------------------------------------------
# targetRevision は必ず具体的なバージョンを書く。"*" や範囲指定は
# 「気づかないうちに更新される」ことを意味し、サプライチェーン攻撃と
# 予期しない破壊的変更の両方のリスクになる（docs/20-security-design.md L4）。
# 更新は Renovate が PR を出す形で行う。
# ===========================================================================
---
# ---------------------------------------------------------------------------
# クラスタ全体のネットワークポリシー
# ---------------------------------------------------------------------------
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: network-policies
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infrastructure
  source:
    repoURL: https://github.com/craftzdev/homelab.git
    targetRevision: main
    path: kubernetes/infra/policies
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true

---
# ---------------------------------------------------------------------------
# Cilium（CNI）
#
# ⚠️ 初回は scripts/bootstrap-cluster.sh が helm install で導入する。
#    この Application は「以降の管理を ArgoCD へ引き継ぐ」ためのもの。
#    同じ values.yaml を参照するため、引き継ぎ時に差分は出ない。
# ---------------------------------------------------------------------------
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cilium
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infrastructure
  # Cilium chart が初回起動時に生成する CA/クライアント/サーバー証明書は
  # 実行時データであり、Git の desired state ではない。data を比較・適用すると
  # Argo CD の hard refresh ごとに証明書が再生成され、部分syncが永久に続く。
  ignoreDifferences:
    - group: ""
      kind: Secret
      name: cilium-ca
      jsonPointers:
        - /data
    - group: ""
      kind: Secret
      name: hubble-relay-client-certs
      jsonPointers:
        - /data
    - group: ""
      kind: Secret
      name: hubble-server-certs
      jsonPointers:
        - /data
  sources:
    - repoURL: https://helm.cilium.io/
      chart: cilium
      targetRevision: 1.20.1
      helm:
        releaseName: cilium
        valueFiles:
          - $values/kubernetes/infra/cilium/values.yaml
    # LoadBalancer IP プールと L2 広告ポリシー
    - repoURL: https://github.com/craftzdev/homelab.git
      targetRevision: main
      path: kubernetes/infra/cilium
      directory:
        include: "lb-ipam.yaml"
    - repoURL: https://github.com/craftzdev/homelab.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: false  # CNI を prune で消すと全断する。手動削除のみ許可。
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - RespectIgnoreDifferences=true

---
# ---------------------------------------------------------------------------
# snapshot-controller（VolumeSnapshot の CRD とコントローラ）
#
# ⚠️ Longhorn より先に導入する必要がある。
#    VolumeSnapshot / VolumeSnapshotClass / VolumeSnapshotContent は
#    Kubernetes のコア API ではなく CRD であり、Kubernetes 本体にも
#    Longhorn の chart にも含まれていない。これが無いと
#    kubernetes/infra/longhorn/ の VolumeSnapshotClass が適用できず、
#    Velero の CSI 連携も機能しない。
# ---------------------------------------------------------------------------
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: snapshot-controller
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infrastructure
  sources:
    - repoURL: https://piraeus.io/helm-charts/
      chart: snapshot-controller
      targetRevision: 5.2.0
      helm:
        releaseName: snapshot-controller
        valueFiles:
          - $values/kubernetes/infra/snapshot-controller/values.yaml
    - repoURL: https://github.com/craftzdev/homelab.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      # ⚠️ prune: false
      #    CRD を prune で消すと、既存の VolumeSnapshot がすべて失われる。
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true

---
# ---------------------------------------------------------------------------
# Longhorn（分散ブロックストレージ）
#
# Ceph を廃止した後の PV を担う。K8s 内で 3 レプリカを持つため、
# 1 ノード障害でもデータは失われない。
# 判断の経緯は docs/adr/0009-drop-ceph-adopt-longhorn.md を参照。
#
# ⚠️ Talos 側で以下が揃っている必要がある（tofu/10-proxmox-talos が設定済み）:
#      - system extension: iscsi-tools, util-linux-tools
#      - UserVolumeConfig で /var/mnt/longhorn を専用ディスクに切り出し
#      - kubelet の extraMounts（rshared）
# ---------------------------------------------------------------------------
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infrastructure
  sources:
    - repoURL: https://charts.longhorn.io
      chart: longhorn
      targetRevision: 1.12.1
      helm:
        releaseName: longhorn
        valueFiles:
          - $values/kubernetes/infra/longhorn/values.yaml
    - repoURL: https://github.com/craftzdev/homelab.git
      targetRevision: main
      path: kubernetes/infra/longhorn
      directory:
        include: "{namespace-and-storageclass.yaml,networkpolicy.yaml}"
    - repoURL: https://github.com/craftzdev/homelab.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn-system
  syncPolicy:
    automated:
      # ⚠️ prune: false
      #    Longhorn の CRD や StorageClass を prune で消すと、
      #    既存 PV が孤児になりデータへ到達できなくなる。削除は手動で行う。
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=false

---
# ---------------------------------------------------------------------------
# Internal image registry
#
# Worker images are retained on a Longhorn-backed private registry. The TLS
# Secret is provisioned out-of-band and is intentionally absent from Git.
# ---------------------------------------------------------------------------
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: image-registry
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infrastructure
  source:
    repoURL: https://github.com/craftzdev/homelab.git
    targetRevision: main
    path: kubernetes/infra/image-registry
  destination:
    server: https://kubernetes.default.svc
    namespace: image-registry
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true

---
# ---------------------------------------------------------------------------
# Harbor private OCI registry
#
# Harbor is introduced alongside the existing bootstrap registry. The old
# endpoint remains available until every image and consumer has been migrated
# and Harbor backup/restore has been verified.
# ---------------------------------------------------------------------------
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: harbor
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "8"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infrastructure
  ignoreDifferences:
    # Harbor generates several long-lived internal credentials. Secret data is
    # created out-of-band or on first install and must not rotate on every Helm
    # render. Metadata remains under GitOps control.
    - group: ""
      kind: Secret
      namespace: harbor
      jsonPointers:
        - /data
    # The upstream chart hashes generated Secret manifests into Pod-template
    # annotations. Argo CD renders Helm without live-cluster lookup, so those
    # hashes would otherwise change on every refresh even though Secret data is
    # intentionally preserved above. Credential rotation uses an explicit
    # rollout after bootstrap-cluster-secrets.sh updates the live Secret.
    - group: apps
      kind: Deployment
      namespace: harbor
      jsonPointers:
        - /spec/template/metadata/annotations
    - group: apps
      kind: StatefulSet
      namespace: harbor
      jsonPointers:
        - /spec/template/metadata/annotations
  sources:
    - repoURL: https://helm.goharbor.io
      chart: harbor
      targetRevision: 1.19.2
      helm:
        releaseName: harbor
        valueFiles:
          - $values/kubernetes/infra/harbor/values.yaml
    - repoURL: https://github.com/craftzdev/homelab.git
      targetRevision: main
      path: kubernetes/infra/harbor
    - repoURL: https://github.com/craftzdev/homelab.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: harbor
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true

---
# ---------------------------------------------------------------------------
# Tailscale Kubernetes Operator
#
# OAuth Secret `operator-oauth` は事前に tailscale namespace へ作成する。
# Git / Argo CD には資格情報を保存しない。Operator は AI Worker の
# Tailnet-only HTTPS ingress と Gateway 向け egress proxy を管理する。
# ---------------------------------------------------------------------------
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tailscale-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infrastructure
  sources:
    - repoURL: https://pkgs.tailscale.com/helmcharts
      chart: tailscale-operator
      targetRevision: 1.102.3
      helm:
        releaseName: tailscale-operator
        valueFiles:
          - $values/kubernetes/infra/tailscale-operator/values.yaml
    - repoURL: https://github.com/craftzdev/homelab.git
      targetRevision: main
      path: kubernetes/infra/tailscale-operator
      directory:
        include: '{argocd-ingress.yaml,grafana-ingress.yaml,hubble-ingress.yaml,dnsconfig.yaml,proxyclass.yaml}'
    - repoURL: https://github.com/craftzdev/homelab.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: tailscale
  syncPolicy:
    automated:
      # OAuth を失った状態で proxy CRD を誤って削除しない。
      prune: false
      selfHeal: true
    # Egress proxy の sysctler init container は Tailscale が要求する
    # namespaced system component。Worker namespace 自体は restricted のまま保つ。
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: privileged
        pod-security.kubernetes.io/audit: restricted
        pod-security.kubernetes.io/warn: restricted
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true

---
# ---------------------------------------------------------------------------
# GitHub Actions Runner Controller
#
# GitHub App credentials are held in the out-of-band arc-github-app Secret.
# The controller and runner scale set are separate Applications so the CRDs and
