githubConfigUrl: https://github.com/craftzdev/moshitoku-scraper
githubConfigSecret: arc-github-app

# moshitoku-scraper の CI（lint / 型検査 / ユニットテスト / マニフェスト検証）用。
#
# イメージビルド用の moshitoku-scraper-builder とは分ける。あちらは Docker-in-Docker
# のため privileged が要るが、CI にその権限は不要である。こちらは homelab-runner と
# 同じく非 root・capability 全 drop で動かす。
#
# Zero idle Pods: GitHub creates one ephemeral runner only when a trusted job
# is queued. Limiting concurrency also prevents CI from exhausting the cluster.
runnerScaleSetName: moshitoku-scraper-ci
minRunners: 0
maxRunners: 1

controllerServiceAccount:
  namespace: arc-systems
  name: arc-controller-gha-rs-controller

template:
  spec:
    automountServiceAccountToken: false
    nodeSelector:
      homelab.craftz.dev/workload-plane: "true"
    securityContext:
      runAsNonRoot: true
      runAsUser: 1001
      runAsGroup: 1001
      fsGroup: 1001
      seccompProfile:
        type: RuntimeDefault
    containers:
      - name: runner
        image: >-
          ghcr.io/actions/actions-runner@sha256:e5496277be5d09bc968b3d64911b74e219ac4a3f2edce956a3ecf9271bea1ef4
        command: ["/home/runner/run.sh"]
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
            # npm ci と tsc、それに取得する検証ツールのぶん。
            # Playwright のブラウザは PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD で落とさない。
            ephemeral-storage: 4Gi
          limits:
            cpu: "2"
            memory: 4Gi
            ephemeral-storage: 8Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]

