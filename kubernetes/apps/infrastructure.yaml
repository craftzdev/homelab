# ===========================================================================
# 基盤コンポーネントの Application 定義
#
# ---------------------------------------------------------------------------
# 同期順序（sync-wave）
# ---------------------------------------------------------------------------
#   -20  policies        : クラスタ全体のネットワークポリシー
#   -10  cilium          : CNI。これが無いと他の Pod が起動しない
#   -15  gateway-api-crds : Gateway API の CRD（Cilium より先に必要）
#    -5  snapshot-controller : VolumeSnapshot の CRD
#     0  longhorn        : 分散ブロックストレージ（PV の供給元）
#     2  cert-manager    : 証明書管理（他が依存する）
#     3  gateway         : HTTP ルーティング（Cilium Gateway API）
#     4  cloudflared     : 外部公開（ingress-nginx が先に必要）
#     5  monitoring      : 監視
#     6  security        : Trivy / kubelet 証明書承認
#     7  velero          : バックアップ
#
# ---------------------------------------------------------------------------
# バージョンの固定について
# ---------------------------------------------------------------------------
# targetRevision は必ず具体的なバージョンを書く。"*" や範囲指定は
# 「気づかないうちに更新される」ことを意味し、サプライチェーン攻撃と
# 予期しない破壊的変更の両方のリスクになる（docs/20-security-design.md L4）。
# 更新は Renovate が PR を出す形で行う。
# ===========================================================================
---
# ---------------------------------------------------------------------------
# クラスタ全体のネットワークポリシー
# ---------------------------------------------------------------------------
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: network-policies
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infrastructure
  source:
    repoURL: https://github.com/craftzdev/homelab.git
    targetRevision: main
    path: kubernetes/infra/policies
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true

---
# ---------------------------------------------------------------------------
# Cilium（CNI）
#
# ⚠️ 初回は scripts/bootstrap-cluster.sh が helm install で導入する。
#    この Application は「以降の管理を ArgoCD へ引き継ぐ」ためのもの。
#    同じ values.yaml を参照するため、引き継ぎ時に差分は出ない。
# ---------------------------------------------------------------------------
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cilium
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infrastructure
  sources:
    - repoURL: https://helm.cilium.io/
      chart: cilium
      targetRevision: 1.20.1
      helm:
        releaseName: cilium
        valueFiles:
          - $values/kubernetes/infra/cilium/values.yaml
    # LoadBalancer IP プールと L2 広告ポリシー
    - repoURL: https://github.com/craftzdev/homelab.git
      targetRevision: main
      path: kubernetes/infra/cilium
      directory:
        include: "lb-ipam.yaml"
    - repoURL: https://github.com/craftzdev/homelab.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: false # CNI を prune で消すと全断する。手動削除のみ許可。
      selfHeal: true
    syncOptions:
      - ServerSideApply=true

---
# ---------------------------------------------------------------------------
# snapshot-controller（VolumeSnapshot の CRD とコントローラ）
#
# ⚠️ Longhorn より先に導入する必要がある。
#    VolumeSnapshot / VolumeSnapshotClass / VolumeSnapshotContent は
#    Kubernetes のコア API ではなく CRD であり、Kubernetes 本体にも
#    Longhorn の chart にも含まれていない。これが無いと
#    kubernetes/infra/longhorn/ の VolumeSnapshotClass が適用できず、
#    Velero の CSI 連携も機能しない。
# ---------------------------------------------------------------------------
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: snapshot-controller
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infrastructure
  sources:
    - repoURL: https://piraeus.io/helm-charts/
      chart: snapshot-controller
      targetRevision: 5.2.0
      helm:
        releaseName: snapshot-controller
        valueFiles:
          - $values/kubernetes/infra/snapshot-controller/values.yaml
    - repoURL: https://github.com/craftzdev/homelab.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      # ⚠️ prune: false
      #    CRD を prune で消すと、既存の VolumeSnapshot がすべて失われる。
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true

---
# ---------------------------------------------------------------------------
# Longhorn（分散ブロックストレージ）
#
# Ceph を廃止した後の PV を担う。K8s 内で 3 レプリカを持つため、
# 1 ノード障害でもデータは失われない。
# 判断の経緯は docs/adr/0009-drop-ceph-adopt-longhorn.md を参照。
#
# ⚠️ Talos 側で以下が揃っている必要がある（tofu/10-proxmox-talos が設定済み）:
#      - system extension: iscsi-tools, util-linux-tools
#      - UserVolumeConfig で /var/mnt/longhorn を専用ディスクに切り出し
#      - kubelet の extraMounts（rshared）
# ---------------------------------------------------------------------------
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infrastructure
  sources:
    - repoURL: https://charts.longhorn.io
      chart: longhorn
      targetRevision: 1.12.1
      helm:
        releaseName: longhorn
        valueFiles:
          - $values/kubernetes/infra/longhorn/values.yaml
    - repoURL: https://github.com/craftzdev/homelab.git
      targetRevision: main
      path: kubernetes/infra/longhorn
      directory:
        include: "{namespace-and-storageclass.yaml,networkpolicy.yaml}"
    - repoURL: https://github.com/craftzdev/homelab.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn-system
  syncPolicy:
    automated:
      # ⚠️ prune: false
      #    Longhorn の CRD や StorageClass を prune で消すと、
      #    既存 PV が孤児になりデータへ到達できなくなる。削除は手動で行う。
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=false

---
# ---------------------------------------------------------------------------
# cert-manager
#
# 用途: クラスタ内部の TLS 証明書（webhook 用、内部通信用）。
# 外部公開の TLS は Cloudflare エッジで終端するため、
# ACME による公開証明書の発行は必須ではない。
# ---------------------------------------------------------------------------
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infrastructure
  sources:
    - repoURL: https://charts.jetstack.io
      chart: cert-manager
      targetRevision: v1.21.1
      helm:
        releaseName: cert-manager
        valueFiles:
          - $values/kubernetes/infra/cert-manager/values.yaml
    - repoURL: https://github.com/craftzdev/homelab.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true

---
# ---------------------------------------------------------------------------
# Gateway API の CRD
#
# ⚠️ Cilium より先に適用する必要がある（sync-wave -15）。
#    CRD が無い状態で gatewayAPI.enabled: true の Cilium を起動すると、
#    operator が Gateway API のリソースを watch できずエラーを繰り返す。
# ---------------------------------------------------------------------------
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway-api-crds
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-15"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infrastructure
  source:
    repoURL: https://github.com/craftzdev/homelab.git
    targetRevision: main
    path: kubernetes/infra/gateway-api
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      # CRD を prune で消すと全ての Gateway / HTTPRoute が失われる
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true

---
# ---------------------------------------------------------------------------
# Gateway（外部公開の入口）
#
# ⚠️ ingress-nginx から移行した。
#    ingress-nginx は 2026 年 3 月で保守終了しており、今後
#    セキュリティ修正が提供されない。外部公開経路の入口に
#    修正されないコンポーネントを置くことは本構成の要件に反する。
#    詳細は kubernetes/infra/gateway-api/kustomization.yaml を参照。
#
# Cilium が GatewayClass "cilium" を提供するため、
# 新しいコントローラを追加する必要はない。
# ---------------------------------------------------------------------------
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infrastructure
  source:
    repoURL: https://github.com/craftzdev/homelab.git
    targetRevision: main
    path: kubernetes/infra/gateway
  destination:
    server: https://kubernetes.default.svc
    namespace: gateway
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false

---
# ---------------------------------------------------------------------------
# cloudflared（外部公開）
#
# ⚠️ このアプリが同期されると、設定された公開ホスト名が
#    インターネットから（Access の認可を経て）到達可能になる。
#    ingress ConfigMap は tofu/20-cloudflare が生成する。
#    転送先は Gateway の ClusterIP Service。
# ---------------------------------------------------------------------------
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudflared
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infrastructure
  source:
    repoURL: https://github.com/craftzdev/homelab.git
    targetRevision: main
    path: kubernetes/infra/cloudflared
  destination:
    server: https://kubernetes.default.svc
    namespace: cloudflared
  syncPolicy:
    automated:
      prune: true
      selfHeal: true

---
# ---------------------------------------------------------------------------
# 監視
# ---------------------------------------------------------------------------
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infrastructure
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 88.6.1
      helm:
        releaseName: kube-prometheus-stack
        valueFiles:
          - $values/kubernetes/infra/monitoring/values.yaml
    # namespace / NetworkPolicy / アラート / Grafana の認証情報（KSOPS）。
    # directory.include を指定すると kustomization.yaml が無視され
    # KSOPS が動かないため、kustomize として扱わせる。
    - repoURL: https://github.com/craftzdev/homelab.git
      targetRevision: main
      path: kubernetes/infra/monitoring
    - repoURL: https://github.com/craftzdev/homelab.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # kube-prometheus-stack の CRD は非常に大きく、
      # client-side apply では annotation のサイズ制限に引っかかる
      - ServerSideApply=true

---
# ---------------------------------------------------------------------------
# セキュリティ namespace とネットワークポリシー
# ---------------------------------------------------------------------------
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: security-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infrastructure
  source:
    repoURL: https://github.com/craftzdev/homelab.git
    targetRevision: main
    path: kubernetes/infra/security
  destination:
    server: https://kubernetes.default.svc
    namespace: security
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false

---
# ---------------------------------------------------------------------------
# kubelet-serving-cert-approver
#
# ⚠️ sync-wave を早め（2）にしている理由:
#    kubelet の serving 証明書が承認されないと、metrics-server や
#    Prometheus が kubelet に接続できない。監視スタック（wave 5）より
#    前に稼働している必要がある。
#
# ⚠️ このコンポーネントは **Helm chart を提供していない**（kustomize のみ）。
#    そのため他のコンポーネントと異なり、kustomize の remote resource として
#    タグ固定で取得する。判断の理由は
#    kubernetes/infra/kubelet-cert-approver/kustomization.yaml を参照。
#
#    namespace は上流のマニフェストが作る `kubelet-serving-cert-approver` を
#    そのまま使う（マニフェスト側で Namespace リソースが定義されている）。
# ---------------------------------------------------------------------------
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kubelet-serving-cert-approver
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infrastructure
  source:
    repoURL: https://github.com/craftzdev/homelab.git
    targetRevision: main
    path: kubernetes/infra/kubelet-cert-approver
  destination:
    server: https://kubernetes.default.svc
    namespace: kubelet-serving-cert-approver
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false

---
# ---------------------------------------------------------------------------
# Trivy Operator（脆弱性スキャン）
# ---------------------------------------------------------------------------
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trivy-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "6"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infrastructure
  sources:
    - repoURL: https://aquasecurity.github.io/helm-charts/
      chart: trivy-operator
      targetRevision: 0.34.0
      helm:
        releaseName: trivy-operator
        valueFiles:
          - $values/kubernetes/infra/security/values-trivy-operator.yaml
    - repoURL: https://github.com/craftzdev/homelab.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: security
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true

---
# ---------------------------------------------------------------------------
# Velero（バックアップ）
#
# ⚠️ バックアップ先（外部オブジェクトストレージ）の設定が済むまで
#    同期は失敗する。これは想定通りの挙動である。
#    セットアップ手順は kubernetes/infra/velero/README.md を参照。
#
# ⚠️ 認証情報（velero-credentials Secret）を KSOPS で管理する場合は、
#    velero ディレクトリに kustomization.yaml を置いた上で、
#    下の Git source から `directory.include` を削除すること。
#    include を指定していると kustomization.yaml が無視される。
# ---------------------------------------------------------------------------
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: velero
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "7"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infrastructure
  sources:
    - repoURL: https://vmware-tanzu.github.io/helm-charts
      chart: velero
      targetRevision: 12.1.0
      helm:
        releaseName: velero
        valueFiles:
          - $values/kubernetes/infra/velero/values.yaml
    - repoURL: https://github.com/craftzdev/homelab.git
      targetRevision: main
      path: kubernetes/infra/velero
      directory:
        include: "{namespace-and-policy.yaml,schedules.yaml}"
    - repoURL: https://github.com/craftzdev/homelab.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: velero
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
