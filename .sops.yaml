# ---------------------------------------------------------------------------
# SOPS 暗号化ルール
#
# 目的:
#   リポジトリに機密情報を「暗号化された状態で」保存し、Git の履歴・差分管理の
#   恩恵を受けつつ、平文が漏れないようにする。
#
# 運用:
#   1) age キーペアを生成する（1度だけ）
#        age-keygen -o ~/.config/sops/age/keys.txt
#   2) 公開鍵を下の `age:` に追記する
#   3) 暗号化      : sops --encrypt --in-place kubernetes/.../foo.sops.yaml
#      編集        : sops kubernetes/.../foo.sops.yaml
#
# 重要:
#   - `encrypted_regex` により Kubernetes Secret の `data`/`stringData` のみを
#     暗号化する。apiVersion/kind/metadata は平文のまま残るため、ArgoCD や
#     kustomize がリソースを解釈でき、差分レビューも可能になる。
#   - 秘密鍵（keys.txt）は絶対にコミットしないこと（.gitignore 済み）。
# ---------------------------------------------------------------------------
creation_rules:
  # Kubernetes マニフェスト用（Secret の data/stringData のみ暗号化）
  - path_regex: kubernetes/.*\.sops\.ya?ml$
    encrypted_regex: '^(data|stringData)$'
    age: >-
      age1mzq6plpzuyrzsp3l2gl6fnjxqztgmrk26ex923uxkj4khkzfdcuqjqjhcg

  # OpenTofu 変数ファイル用（ファイル全体を暗号化）
  - path_regex: tofu/.*\.sops\.ya?ml$
    age: >-
      age1mzq6plpzuyrzsp3l2gl6fnjxqztgmrk26ex923uxkj4khkzfdcuqjqjhcg

  # その他（talos secrets 等、ファイル全体を暗号化）
  - path_regex: .*\.sops\.ya?ml$
    age: >-
      age1mzq6plpzuyrzsp3l2gl6fnjxqztgmrk26ex923uxkj4khkzfdcuqjqjhcg
