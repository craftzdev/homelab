name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer commit makes an older validation result irrelevant. Cancelling it
# avoids spending hosted minutes and keeps the single self-hosted runner free.
concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TALOS_VERSION: v1.13.9
  KUBERNETES_VERSION: 1.34.3
  GITLEAKS_VERSION: 8.30.1
  KUSTOMIZE_VERSION: v5.8.1
  SHELLCHECK_VERSION: v0.10.0
  UV_VERSION: 0.12.12
  YAMLLINT_VERSION: 1.37.1

jobs:
  validate:
    name: repository validation
    # Fork pull requests never enter the home network. Trusted pushes and
    # manual runs use the isolated, ephemeral ARC scale set in Kubernetes.
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || 'homelab-runner' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          # The current and previous revisions are enough for normal pushes.
          # Pull requests fetch their base revision below only when necessary.
          fetch-depth: 2

      - name: Determine affected validators
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == workflow_dispatch ]]; then
            base="$(git rev-parse HEAD^ 2>/dev/null || git hash-object -t tree /dev/null)"
            changed=$'talos/\ntofu/\nkubernetes/\n.github/workflows/validate.yaml'
          else
            base="${BASE_SHA:-${BEFORE_SHA:-}}"
            if [[ -z "${base}" || "${base}" =~ ^0+$ ]]; then
              base="$(git hash-object -t tree /dev/null)"
            fi
            if ! git cat-file -e "${base}" 2>/dev/null; then
              git fetch --no-tags --depth=1 origin "${base}"
            fi
            changed="$(git diff --name-only "${base}" "${GITHUB_SHA}")"
          fi

          match() { grep -Eq "$1" <<<"${changed}"; }
          {
            echo "scan_range=${base}..${GITHUB_SHA}"
            echo "talos=$([[ "${EVENT_NAME}" == workflow_dispatch ]] || match '^(talos/|tofu/10-proxmox-talos/|\.github/scripts/render-talos-patches\.py$|\.github/workflows/validate\.yaml$)' && echo true || echo false)"
            echo "helm=$([[ "${EVENT_NAME}" == workflow_dispatch ]] || match '^(kubernetes/apps/|kubernetes/infra/.*/values[^/]*\.yaml$|\.github/scripts/check-helm-charts\.py$|\.github/workflows/validate\.yaml$)' && echo true || echo false)"
            echo "kustomize=$([[ "${EVENT_NAME}" == workflow_dispatch ]] || match '^(kubernetes/|\.github/workflows/validate\.yaml$)' && echo true || echo false)"
            echo "tofu=$([[ "${EVENT_NAME}" == workflow_dispatch ]] || match '^(tofu/|\.github/workflows/validate\.yaml$)' && echo true || echo false)"
          } >>"${GITHUB_OUTPUT}"

      - name: Install lightweight validation tools
        run: |
          set -euo pipefail
          bin_dir="${RUNNER_TEMP}/ci-bin"
          mkdir -p "${bin_dir}"

          curl -fsSL \
            "https://github.com/astral-sh/uv/releases/download/${UV_VERSION}/uv-x86_64-unknown-linux-gnu.tar.gz" \
            -o "${RUNNER_TEMP}/uv.tar.gz"
          tar -xzf "${RUNNER_TEMP}/uv.tar.gz" -C "${RUNNER_TEMP}"
          UV_TOOL_BIN_DIR="${bin_dir}" \
            "${RUNNER_TEMP}/uv-x86_64-unknown-linux-gnu/uv" tool install \
            --python /usr/bin/python3 "yamllint==${YAMLLINT_VERSION}"

          curl -fsSL \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            -o "${RUNNER_TEMP}/shellcheck.tar.xz"
          ARCHIVE="${RUNNER_TEMP}/shellcheck.tar.xz" \
            DESTINATION="${RUNNER_TEMP}" \
            python3 -c 'import os, tarfile; tarfile.open(os.environ["ARCHIVE"], "r:xz").extractall(os.environ["DESTINATION"])'
          ln -s "${RUNNER_TEMP}/shellcheck-${SHELLCHECK_VERSION}/shellcheck" \
            "${bin_dir}/shellcheck"

          curl -fsSL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o "${RUNNER_TEMP}/gitleaks.tar.gz"
          tar -xzf "${RUNNER_TEMP}/gitleaks.tar.gz" -C "${bin_dir}" gitleaks
          echo "${bin_dir}" >>"${GITHUB_PATH}"

      - name: Detect committed secrets
        run: >-
          ${RUNNER_TEMP}/ci-bin/gitleaks git --redact --no-banner
          --log-opts="${{ steps.changes.outputs.scan_range }} --first-parent"

      - name: Verify SOPS files are encrypted
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r -d '' file; do
            if ! grep -q 'sops:' "${file}"; then
              echo "::error file=${file}::SOPS で暗号化されていません（平文の可能性）"
              fail=1
            fi
            if ! grep -q 'ENC\[' "${file}"; then
              echo "::error file=${file}::暗号化された値が見つかりません"
              fail=1
            fi
          done < <(find . -type f -name '*.sops.yaml' ! -name '.sops.yaml' \
            ! -name '*.example' -print0)
          exit "${fail}"

      - name: Lint YAML and shell scripts
        run: |
          yamllint -c .yamllint.yaml kubernetes/ docs/ .github/
          shellcheck -x scripts/*.sh

      - name: Install talosctl
        if: steps.changes.outputs.talos == 'true'
        run: |
          curl -fsSL \
            "https://github.com/siderolabs/talos/releases/download/${TALOS_VERSION}/talosctl-linux-amd64" \
            -o "${RUNNER_TEMP}/ci-bin/talosctl"
          chmod +x "${RUNNER_TEMP}/ci-bin/talosctl"

      - name: Generate and strictly validate Talos config
        if: steps.changes.outputs.talos == 'true'
        run: |
          set -euo pipefail
          python3 .github/scripts/render-talos-patches.py "${RUNNER_TEMP}/talos"
          cd "${RUNNER_TEMP}/talos"
          for role in controlplane worker; do
            patch=$([ "${role}" = controlplane ] && echo cp.yaml || echo wk.yaml)
            talosctl gen config homelab https://172.16.40.10:6443 \
              --talos-version "${TALOS_VERSION}" \
              --kubernetes-version "${KUBERNETES_VERSION}" \
              --with-docs=false --with-examples=false \
              --output-types "${role}" --output "${role}.yaml" \
              --config-patch @"${patch}" --config-patch @fw.yaml --force
            talosctl validate --config "${role}.yaml" --mode cloud --strict
          done

      - uses: azure/setup-helm@v4
        if: steps.changes.outputs.helm == 'true'
        with:
          version: v3.18.6

      - name: Render Helm charts
        if: steps.changes.outputs.helm == 'true'
        run: python3 .github/scripts/check-helm-charts.py

      - name: Install kustomize
        if: steps.changes.outputs.kustomize == 'true'
        run: |
          curl -fsSL \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" \
            -o "${RUNNER_TEMP}/kustomize.tar.gz"
          tar -xzf "${RUNNER_TEMP}/kustomize.tar.gz" \
            -C "${RUNNER_TEMP}/ci-bin" kustomize

      - name: Build Kustomize overlays
        if: steps.changes.outputs.kustomize == 'true'
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r -d '' file; do
            dir="$(dirname "${file}")"
            if grep -q 'kind: ksops' "${dir}"/*.yaml 2>/dev/null; then
              echo "skip (KSOPS): ${dir}"
              continue
            fi
            if ! kustomize build --enable-alpha-plugins "${dir}" >/dev/null; then
              echo "::error file=${file}::kustomize build に失敗しました"
              fail=1
            fi
          done < <(find kubernetes -name kustomization.yaml -print0)
          exit "${fail}"

      - name: Install OpenTofu
        if: steps.changes.outputs.tofu == 'true'
        run: |
          curl -fsSL \
            "https://github.com/opentofu/opentofu/releases/download/v1.12.6/tofu_1.12.6_linux_amd64.zip" \
            -o "${RUNNER_TEMP}/tofu.zip"
          unzip -q "${RUNNER_TEMP}/tofu.zip" tofu \
            -d "${RUNNER_TEMP}/ci-bin"

      - name: Validate OpenTofu modules
        if: steps.changes.outputs.tofu == 'true'
        run: |
          set -euo pipefail
          tofu fmt -check -recursive tofu/
          for dir in tofu/10-proxmox-talos tofu/20-cloudflare; do
            tofu -chdir="${dir}" init -backend=false
            tofu -chdir="${dir}" validate
          done
