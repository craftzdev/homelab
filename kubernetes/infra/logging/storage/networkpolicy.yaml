---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: logging
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]

---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: logging-dns-and-probes
  namespace: logging
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
  ingress:
    - fromEntities:
        - host
        - remote-node

---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: minio-access
  namespace: logging
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: minio
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: logging
            app.kubernetes.io/name: loki
        - matchLabels:
            io.kubernetes.pod.namespace: logging
            app.kubernetes.io/name: minio-bucket-bootstrap
        - matchLabels:
            io.kubernetes.pod.namespace: analytics
        - matchLabels:
            io.kubernetes.pod.namespace: monitoring
        # CloudNativePG のバックアップ先は R2 へ移った（ADR-0012）。
        # この経路はもう書き込みには使われていないが、MinIO には R2 が
        # まだ持っていない 4〜6 日分の世代が残っており、**そこからの復元
        # 経路として残している。** R2 の保持が 7 日に達したら
        # （2026-09-23 頃）、バケットごとこの 2 つの許可も消すこと。
        # 経緯は docs/minio-cnpg-decommission-2026-09-16.md を参照。
        #
        # ⚠️ 消す順序を誤らないこと。ここを先に消すと、冷凍コピーが
        #    残っていても復元できない。
        #
        # ⚠️ クラスタ名を直接指さない。復元は別名のクラスタとして起動し、
        #    その Job の Pod は cnpg.io/cluster=<復元先の名前> を持つ。
        #    名前で固定すると復元がここへ接続できず、**バックアップは
        #    取れているのに戻せない。** 実際に復元を試して分かった。
        #    送信側（moshitoku 名前空間の egress）だけ直しても通らない。
        #    Cilium は両側で許可されて初めて通る。
        - matchExpressions:
            - key: cnpg.io/cluster
              operator: Exists
          matchLabels:
            io.kubernetes.pod.namespace: moshitoku
      toPorts:
        - ports:
            - port: "9000"
              protocol: TCP

---
# ===========================================================================
# moshitoku の bucket 作成 Job から MinIO への egress
#
# ⚠️ bootstrap Job ごとにラベルが違うため、Job を増やすたびにここと
#    minio-access の ingress の両方へ追記が必要である。片方だけだと
#    `mc` が i/o timeout で失敗し、原因が NetworkPolicy だと分かりにくい。
# ===========================================================================
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: minio-bootstrap-egress
  namespace: logging
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: minio-bucket-bootstrap
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: logging
            app.kubernetes.io/name: minio
      toPorts:
        - ports:
            - port: "9000"
              protocol: TCP

---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: loki-access
  namespace: logging
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: loki
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: logging
            app.kubernetes.io/name: minio
      toPorts:
        - ports:
            - port: "9000"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: logging
            app.kubernetes.io/name: loki
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: logging
        - matchLabels:
            io.kubernetes.pod.namespace: logging-audit
        - matchLabels:
            io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports:
            - port: "3100"
              protocol: TCP
            - port: "7946"
              protocol: TCP

---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: alloy-access
  namespace: logging
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: alloy
  egress:
    - toEntities:
        - kube-apiserver
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: logging
            app.kubernetes.io/name: loki
      toPorts:
        - ports:
            - port: "3100"
              protocol: TCP
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports:
            - port: "12345"
              protocol: TCP
