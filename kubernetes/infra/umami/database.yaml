apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: umami-minio
  namespace: analytics
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  retentionPolicy: "30d"
  configuration:
    # -----------------------------------------------------------------------
    # バックアップ先は Cloudflare R2（クラスタ外）
    #
    # 以前はクラスタ内 MinIO（s3://umami-postgres/ →
    # minio.logging.svc.cluster.local:9000）に置いていた。その MinIO は
    # Longhorn の上にあり、**守るべき対象と同じストレージ**に載っていた。
    # Longhorn が論理破損すれば DB とそのバックアップが同時に消える。
    # ADR-0008 が「旧構成の minio-for-velero と同じ問題」として警告していた
    # 状態そのものである。
    #
    # 2026-09-16 の実測では、Longhorn の実データ 46.2 GiB のうち代替不能なのは
    # 231 MB だけ（moshitoku 200MB / umami 31MB）。残りは保持 15 日の監視
    # データと再ビルド可能なコンテナイメージ。R2 の無料枠 10 GB に十分収まる。
    #
    # ⚠️ 認証情報は umami-s3-credentials ではなく umami-r2-credentials。
    #    前者は MinIO 用で bootstrap-umami-secrets.sh が管理しており、
    #    上書きすると次回実行時に MinIO の値へ戻される。
    #    投入は scripts/reconcile-cnpg-r2-credentials.sh（1Password から読む）。
    #
    # 📌 NetworkPolicy の追加は不要（2026-09-16 に実機確認）。
    #    CiliumClusterwideNetworkPolicy/deny-egress-to-home-network は
    #    除外リスト（ceph-csi / kube-system / portal / velero / status）以外の
    #    全 namespace に `egress: toEntities: all` を与えており、宅内 CIDR 以外へは
    #    既に出られる。analytics も対象なので R2 へ到達できる。
    #
    #    ⚠️ 逆に言えば、将来 analytics を除外リストへ追加した場合は
    #       この宛先への egress を明示的に書かないとバックアップが無言で止まる。
    #       その際は CNPGBackupStale / CNPGNoBackupEver が鳴る。
    #
    # 経緯は docs/storage-migration-2026-09-13.md を参照。
    # -----------------------------------------------------------------------
    destinationPath: s3://homelab-umami-postgres/
    endpointURL: https://1a04b6f3502614c09cde09c933331300.r2.cloudflarestorage.com
    s3Credentials:
      accessKeyId:
        name: umami-r2-credentials
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: umami-r2-credentials
        key: ACCESS_SECRET_KEY
    wal:
      compression: gzip
    data:
      compression: gzip
  instanceSidecarConfiguration:
    retentionPolicyIntervalSeconds: 1800
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi

---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: umami-postgres
  namespace: analytics
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
  labels:
    app.kubernetes.io/name: umami-postgres
    app.kubernetes.io/part-of: analytics
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:17.11-standard-trixie@sha256:d12317e4365edf4c6237ae6ff5e18d7568a580a5fa8285fae6c385ac5e51d0bf
  imagePullPolicy: IfNotPresent
  primaryUpdateStrategy: unsupervised
  enableSuperuserAccess: false
  bootstrap:
    initdb:
      database: umami
      owner: umami
      secret:
        name: umami-db-owner
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname
    nodeSelector:
      homelab.craftz.dev/workload-plane: "true"
  storage:
    storageClass: longhorn-cnpg-retain
    size: 10Gi
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi
  postgresql:
    parameters:
      timezone: UTC
      log_timezone: UTC
      max_connections: "100"
      shared_buffers: 128MB
  monitoring:
    enablePodMonitor: true
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: umami-minio
        # Keep this stable for the lifetime of this PostgreSQL cluster. Bump
        # the suffix only when intentionally starting a new backup lineage.
        serverName: umami-postgres-v1

---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: umami-postgres-daily
  namespace: analytics
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  # CloudNativePG evaluates this six-field cron in UTC: 18:30 UTC = 03:30 JST.
  schedule: "0 30 18 * * *"
  # Avoid racing the initial primary bootstrap. Operators can trigger the
  # first backup after all three instances are healthy.
  immediate: false
  backupOwnerReference: self
  target: prefer-standby
  cluster:
    name: umami-postgres
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
