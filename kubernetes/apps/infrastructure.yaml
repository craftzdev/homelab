      - ServerSideApply=true

---
# ---------------------------------------------------------------------------
# 監視
# ---------------------------------------------------------------------------
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infrastructure
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 88.6.1
      helm:
        releaseName: kube-prometheus-stack
        valueFiles:
          - $values/kubernetes/infra/monitoring/values.yaml
    # namespace / NetworkPolicy / アラート / Grafana の認証情報（KSOPS）。
    # directory.include を指定すると kustomization.yaml が無視され
    # KSOPS が動かないため、kustomize として扱わせる。
    - repoURL: https://github.com/craftzdev/homelab.git
      targetRevision: main
      path: kubernetes/infra/monitoring
    - repoURL: https://github.com/craftzdev/homelab.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # kube-prometheus-stack の CRD は非常に大きく、
      # client-side apply では annotation のサイズ制限に引っかかる
      - ServerSideApply=true

---
# ---------------------------------------------------------------------------
# ログ基盤の永続ストレージ
#
# MinIO は単一 Pod とし、Longhorn の 2 レプリカでノード障害に備える。
# MinIO 自身の分散レプリケーションと Longhorn のレプリケーションを重ねない。
# ---------------------------------------------------------------------------
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: logging-storage
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infrastructure
  ignoreDifferences:
    # StatefulSet controllerがPVC templateへ実行時statusを追加する。
    - group: apps
      kind: StatefulSet
      name: minio
      jqPathExpressions:
        - .spec.volumeClaimTemplates[]?.status
  source:
    repoURL: https://github.com/craftzdev/homelab.git
    targetRevision: main
    path: kubernetes/infra/logging/storage
  destination:
    server: https://kubernetes.default.svc
    namespace: logging
  syncPolicy:
    automated:
      # MinIO の PVC/PV は Retain。Application の誤削除時にもデータを残す。
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
      - RespectIgnoreDifferences=true

