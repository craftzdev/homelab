name: configuration controller contracts
on:
  pull_request:
    paths:
      - ai-business-platform/config-controller/**
      - .github/workflows/config-controller-tests.yaml
  push:
    branches: [main]
    paths:
      - ai-business-platform/config-controller/**
      - .github/workflows/config-controller-tests.yaml
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt pytest && python -m pytest -q
        working-directory: ai-business-platform/config-controller
