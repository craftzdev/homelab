# ===========================================================================
# Gateway — 外部公開の入口
#
# cloudflared からのリクエストを受け、HTTPRoute の定義に従って
# 各アプリの Service へ振り分ける。ingress-nginx の役割を引き継ぐ。
#
# ---------------------------------------------------------------------------
# Ingress との違いと、それが嬉しい理由
# ---------------------------------------------------------------------------
# Ingress は「1 つのリソースにルーティングも TLS も annotation による
# 独自拡張も全部詰め込む」設計だった。誰が何を変更してよいかが曖昧で、
# annotation 経由の設定注入が脆弱性の温床にもなっていた
# （ingress-nginx の snippet annotation 関連の CVE 群）。
#
# Gateway API は役割を分離する:
#   - Gateway   … 基盤チームが管理。どのポートを開き、どの namespace から
#                  ルートを受け付けるかを決める（このファイル）
#   - HTTPRoute … アプリチームが管理。自分の namespace 内でパスと
#                  バックエンドを定義する
#
# 「Ingress を作れる権限」が「任意の内部サービスを公開できる権限」に
# なっていた問題が、構造的に解消される。
# ===========================================================================
---
apiVersion: v1
kind: Namespace
metadata:
  name: gateway
  labels:
    # Cilium の Envoy は cilium-agent の一部として動くため、
    # この namespace には Gateway リソースしか存在しない。
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted

    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: external-access

    # 下の default-404 HTTPRoute はこの namespace にあるため、Gateway の
    # allowedRoutes セレクタに一致していなければ受け付けられない。
    # このラベルが無いと catch-all が機能せず、未定義のホスト名に対して
    # Gateway の既定応答が露出する。
    homelab.io/gateway-access: external

---
# ===========================================================================
# Gateway が作る Service の設定
#
# allocateLoadBalancerNodePorts: false が本体である。これが無いと
# Kubernetes は LoadBalancer Service に NodePort を割り当て、全ノードの
# VLAN40 アドレスで Gateway に到達できてしまう。
# ===========================================================================
apiVersion: cilium.io/v2alpha1
kind: CiliumGatewayClassConfig
metadata:
  name: external-no-nodeport
  namespace: gateway
  labels:
    app.kubernetes.io/part-of: external-access
spec:
  # CRD 側で 64 バイトまでに制限されている。詳細は上のコメントを参照。
  description: External gateway service; no NodePort.
  service:
    type: LoadBalancer
    allocateLoadBalancerNodePorts: false

---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: external
  namespace: gateway
  labels:
    app.kubernetes.io/part-of: external-access
spec:
  gatewayClassName: cilium

  # -------------------------------------------------------------------------
  # ⚠️ LAN 側に第 2 の入口を作らせない
  #
  # Cilium の Gateway API は必ず Service を作る。type に選べるのは
  # LoadBalancer か NodePort だけで、ClusterIP は指定できない
  # （CiliumGatewayClassConfig の service.type がこの 2 つに限定されている）。
  # 以前ここに書かれていた `io.cilium/lb-mode: clusterip` という annotation は
  # Cilium が読まないため、何の効果も無かった。
  #
  # 実際の入口は 2 つありうる。
  #
  #   1. LoadBalancer の外部 IP
  #      → vlan40-pool の serviceSelector が
  #        `homelab.io/lan-exposed: "true"` を要求しており、この Service には
  #        付いていないため IP は割り当てられない。
  #
  #   2. NodePort
  #      → 既定では割り当てられてしまう。全ノードの VLAN40 アドレスで
  #        Gateway に到達でき、Cloudflare Access を迂回できる。
  #        下の parametersRef でこれを無効化する。
  #
  # 結果として Service は ClusterIP 経由でしか到達できず、
  # 「外部公開は Cloudflare Tunnel のみ」が構成として保証される。
  # -------------------------------------------------------------------------
  infrastructure:
    parametersRef:
      group: cilium.io
      kind: CiliumGatewayClassConfig
      name: external-no-nodeport

  listeners:
    # -------------------------------------------------------------------------
    # HTTP のみ。TLS 終端は Cloudflare エッジで行う。
    #
    # cloudflared → Gateway はクラスタ内部の通信であり、
    # Cilium の WireGuard でノード間は暗号化されている。
    # ここで TLS を終端すると証明書の管理が増えるだけで、
    # 守られる範囲は変わらない。
    # -------------------------------------------------------------------------
    - name: http
      protocol: HTTP
      port: 80

      # -----------------------------------------------------------------------
      # ⚠️ どの namespace から HTTPRoute を受け付けるかを制限する
      #
      # `from: All` にすると、任意の namespace の誰でも
      # 「この Gateway 経由で自分のサービスを公開する」ことができてしまう。
      # ラベルで明示的に許可した namespace だけに限定する。
      #
      # 公開したい namespace には次のラベルを付ける:
      #   kubectl label namespace <ns> homelab.io/gateway-access=external
      # -----------------------------------------------------------------------
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              homelab.io/gateway-access: external
        kinds:
          - kind: HTTPRoute

---
# ===========================================================================
# 既定の応答（catch-all）
#
# どの HTTPRoute にも一致しないリクエストに 404 を返す。
# これが無いと Gateway の既定応答が露出し、内部構成の手がかりを与えうる。
# ===========================================================================
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: default-404
  namespace: gateway
  labels:
    app.kubernetes.io/part-of: external-access
spec:
  parentRefs:
    - name: external
      namespace: gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            # 意図しないホスト名でのアクセスに情報を返さない
            statusCode: 302
            hostname: cloudflare.com
