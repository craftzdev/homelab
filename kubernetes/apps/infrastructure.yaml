    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true

---
# ---------------------------------------------------------------------------
# Gateway API の CRD
#
# ⚠️ Cilium より先に適用する必要がある（sync-wave -15）。
#    CRD が無い状態で gatewayAPI.enabled: true の Cilium を起動すると、
#    operator が Gateway API のリソースを watch できずエラーを繰り返す。
# ---------------------------------------------------------------------------
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
