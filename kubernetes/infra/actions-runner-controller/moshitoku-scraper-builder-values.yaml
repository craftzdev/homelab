# ===========================================================================
# moshitoku-scraper のイメージビルド用セルフホストランナー
#
# GitHub ホストランナーからは Harbor（172.16.40.201:5000）へ到達できないため、
# クラスタ内でビルドして push する。
#
# 既存の moshitoku-builder と同じ構成であり、差分は
# githubConfigUrl / runnerScaleSetName と ephemeral-storage の指定のみ。
#
# Playwright 公式イメージは 3.5GB あり、他のアプリのイメージよりかなり大きい。
# ベースの取得・ビルド・buildcache を合わせてノードの一時領域を 15GB 程度使う。
# ===========================================================================
githubConfigUrl: https://github.com/craftzdev/moshitoku-scraper
githubConfigSecret: arc-github-app

runnerScaleSetName: moshitoku-scraper-builder
minRunners: 0
maxRunners: 1

controllerServiceAccount:
  namespace: arc-systems
  name: arc-controller-gha-rs-controller

template:
  spec:
    automountServiceAccountToken: false
    nodeSelector:
      homelab.craftz.dev/workload-plane: 'true'
    initContainers:
      - name: init-dind-externals
        image: >-
          ghcr.io/actions/actions-runner@sha256:e5496277be5d09bc968b3d64911b74e219ac4a3f2edce956a3ecf9271bea1ef4
        command: ['cp', '-r', '/home/runner/externals/.', '/home/runner/tmpDir/']
        volumeMounts:
          - name: dind-externals
            mountPath: /home/runner/tmpDir
      - name: dind
        image: >-
          docker:29.8.0-dind@sha256:5efed980cba3fc126cf54e21a5a6ff8849d05b6e0623d6e7612f48e9cd6cd17e
        command: ['/bin/sh', '-c']
        args:
          - >-
            update-ca-certificates &&
            exec dockerd --host=unix:///var/run/docker.sock --group=${DOCKER_GROUP_GID}
        env:
          - name: DOCKER_GROUP_GID
            value: '123'
        securityContext:
          privileged: true
        restartPolicy: Always
        startupProbe:
          exec:
            command: ['docker', 'info']
          failureThreshold: 24
          periodSeconds: 5
        volumeMounts:
          - name: work
            mountPath: /home/runner/_work
          - name: dind-sock
            mountPath: /var/run
          - name: dind-externals
            mountPath: /home/runner/externals
          - name: harbor-ci-cert
            mountPath: /etc/docker/certs.d/172.16.40.201:5000/ca.crt
            subPath: tls.crt
            readOnly: true
          - name: harbor-ci-cert
            mountPath: /usr/local/share/ca-certificates/harbor-ci.crt
            subPath: tls.crt
            readOnly: true
    containers:
      - name: runner
        image: >-
          ghcr.io/actions/actions-runner@sha256:e5496277be5d09bc968b3d64911b74e219ac4a3f2edce956a3ecf9271bea1ef4
        command: ['/home/runner/run.sh']
        env:
          - name: DOCKER_HOST
            value: unix:///var/run/docker.sock
          - name: RUNNER_WAIT_FOR_DOCKER_IN_SECONDS
            value: '120'
        volumeMounts:
          - name: work
            mountPath: /home/runner/_work
          - name: dind-sock
            mountPath: /var/run
          - name: harbor-ci-cert
            mountPath: /etc/harbor-ci/ca.crt
            subPath: tls.crt
            readOnly: true
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
            # ⚠️ moshitoku-builder との唯一の実質的な差分。
            #    Playwright 公式イメージは 3.5GB あり、ベースの取得・ビルド・
            #    buildcache を合わせるとノードの一時領域を 15GB 程度使う。
            #    明示しないとスケジューラが空き容量を考慮せず、
            #    ノードが DiskPressure になって他の Pod が退避されうる。
            ephemeral-storage: 20Gi
          limits:
            cpu: '4'
            memory: 8Gi
            ephemeral-storage: 40Gi
    volumes:
      - name: work
        emptyDir: {}
      - name: dind-sock
        emptyDir: {}
      - name: dind-externals
        emptyDir:
          medium: Memory
          sizeLimit: 1Gi
      - name: harbor-ci-cert
        secret:
          secretName: harbor-ci-proxy-tls
